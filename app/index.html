<style>
:root{--r:14px}
/* 글꼴 묶음 (테마 창에서 고름, 기본 '또렷') — --wd 제목·--wu 목차·--wc 카드 이름·--wb 본문 굵기 */
@font-face{font-family:'BS Square';font-weight:100 900;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/NanumSquareNeo/NanumSquareNeoTTF-eHv.woff) format("woff")}
[data-font]{--wd:700;--wu:500;--wc:600;--wb:400}
[data-font=bold]{--disp:'Pretendard Variable',Pretendard,system-ui,sans-serif;--body:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;--wd:800;--wu:600;--wc:700;--wb:500}
[data-font=square]{--disp:'BS Square','Pretendard Variable',Pretendard,system-ui,sans-serif;--body:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;--wd:800;--wu:600;--wc:700;--wb:500}
[data-font=serif]{--disp:'Noto Serif KR',serif;--body:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif}
[data-font=gowun]{--disp:'Gowun Batang',serif;--body:'Gowun Dodum',system-ui,sans-serif}
[data-font=book]{--disp:'Nanum Myeongjo',serif;--body:'Nanum Myeongjo',serif}
[data-font=old]{--disp:'Gowun Batang',serif;--body:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif}
/* 밤 서재 (기본) */
:root,[data-theme=night]{color-scheme:dark;
  --bg:#111114;--side:#0D0D10;--card:#18181D;--card2:#1F1F25;--hover:#18181C;--sunk:#111114;--sunk2:#141418;--chip:#22222A;--ph:#2A2A31;
  --line:#26262D;--line2:#33333C;--line3:#3A3A43;--line4:#55555F;
  --ink:#ECEAE6;--ink2:#C9C7CE;--ink3:#A3A1A8;--mute:#8A8890;--mute2:#55545C;--prose:#E2E0DC;--msg:#E6E4E0;--em:#B8B6BE;
  --acc:#F2B655;--acc2:#F7CD85;--acc-bg:#3A3222;--acc-soft:#1C1A16;--acc-line:#5A4A2A;--acc-text:#F2CF8F;--acc-ink:#1A1611;
  --teal:#5EC2B7;--teal-bg:#22524C;--teal-line:#2E5A54;--teal-text:#9FE0D7;--red:#F08A8A;--red-bg:#2A1C1C;--red-line:#7A3A3A;
  --dlg:#18181D;--dlg-line:#2E2E36;--dim:rgba(5,5,7,.72);--topbar:rgba(17,17,20,.92);--shadow:rgba(0,0,0,.55);
  --quote:#16161A;--memo:#141210;--drop-hover:#1A1814;--tog-off:#33333C;--knob:#A3A1A8;--dot-off:#77757D;--fc-dark:0%;--blur-op:.28}
/* 낮 서재 — 오래된 종이 */
[data-theme=day]{color-scheme:light;
  --bg:#F4EFE5;--side:#ECE5D7;--card:#FFFCF6;--card2:#F2ECE1;--hover:#E8E0D0;--sunk:#FFFDF9;--sunk2:#F7F2E9;--chip:#ECE4D5;--ph:#D9CFBE;
  --line:#E3DACA;--line2:#D8CDBA;--line3:#CABFA9;--line4:#A99C85;
  --ink:#2B2620;--ink2:#4A4238;--ink3:#6B6155;--mute:#857A6B;--mute2:#B8AE9E;--prose:#3A332B;--msg:#2F2922;--em:#6B6155;
  --acc:#B86E1F;--acc2:#9A5A14;--acc-bg:#F6E3C6;--acc-soft:#F4E8D3;--acc-line:#E0BE8A;--acc-text:#8A4F0E;--acc-ink:#FFF8EE;
  --teal:#2D8C80;--teal-bg:#CDEBE6;--teal-line:#8FCFC5;--teal-text:#1F6B61;--red:#C24A4A;--red-bg:#FBE9E7;--red-line:#E8B2AC;
  --dlg:#FFFCF6;--dlg-line:#E3DACA;--dim:rgba(60,48,30,.35);--topbar:rgba(244,239,229,.92);--shadow:rgba(90,65,30,.18);
  --quote:#F3ECDF;--memo:#FBF3E4;--drop-hover:#F6EBD8;--tog-off:#D8CDBA;--knob:#FFFFFF;--dot-off:#B8AE9E;--fc-dark:45%;--blur-op:.18}
/* 새벽 — 남색 하늘 */
[data-theme=dawn]{color-scheme:dark;
  --bg:#0E1320;--side:#0A0E18;--card:#151C2B;--card2:#1B2334;--hover:#161E2E;--sunk:#0D1220;--sunk2:#111827;--chip:#1E2738;--ph:#263049;
  --line:#222B3D;--line2:#2D3850;--line3:#36435E;--line4:#526079;
  --ink:#E8ECF4;--ink2:#C3CBDB;--ink3:#9BA6BC;--mute:#7F8AA1;--mute2:#4E5870;--prose:#DEE4EF;--msg:#E2E7F0;--em:#AEB8CC;
  --acc:#8FB8E8;--acc2:#B3CFF0;--acc-bg:#1F3150;--acc-soft:#16233A;--acc-line:#34507A;--acc-text:#BFD6F2;--acc-ink:#0B1424;
  --teal:#6FD0C4;--teal-bg:#1D4A4B;--teal-line:#2B5C5C;--teal-text:#A6E6DE;--red:#F09A9A;--red-bg:#2C1C25;--red-line:#7A3A4A;
  --dlg:#151C2B;--dlg-line:#2A3448;--dim:rgba(4,7,14,.72);--topbar:rgba(14,19,32,.92);--shadow:rgba(0,0,0,.55);
  --quote:#121929;--memo:#121B2C;--drop-hover:#16213A;--tog-off:#2D3850;--knob:#9BA6BC;--dot-off:#69748B;--fc-dark:0%;--blur-op:.3}
/* 숲 — 깊은 초록 */
[data-theme=forest]{color-scheme:dark;
  --bg:#0F1512;--side:#0B100D;--card:#16201B;--card2:#1C2822;--hover:#17211C;--sunk:#0E1411;--sunk2:#121A16;--chip:#1F2B25;--ph:#28362E;
  --line:#223029;--line2:#2D3D34;--line3:#36483E;--line4:#52665A;
  --ink:#E7EDE8;--ink2:#C3CFC6;--ink3:#9DAEA2;--mute:#81938A;--mute2:#4F6157;--prose:#DEE7E0;--msg:#E1E9E3;--em:#AEBDB2;
  --acc:#A8D27C;--acc2:#C2E1A0;--acc-bg:#2A3A20;--acc-soft:#1A2618;--acc-line:#46603A;--acc-text:#CBE6AE;--acc-ink:#111A0C;
  --teal:#6CCFB4;--teal-bg:#1E4A3F;--teal-line:#2C5E50;--teal-text:#A4E5D2;--red:#EE9A8E;--red-bg:#2B1D1A;--red-line:#7A4038;
  --dlg:#16201B;--dlg-line:#2A3830;--dim:rgba(4,8,6,.72);--topbar:rgba(15,21,18,.92);--shadow:rgba(0,0,0,.55);
  --quote:#131C17;--memo:#151F15;--drop-hover:#18241A;--tog-off:#2D3D34;--knob:#9DAEA2;--dot-off:#6B7D72;--fc-dark:0%;--blur-op:.28}
/* 벚꽃 — 연분홍 낮 */
[data-theme=sakura]{color-scheme:light;
  --bg:#FBF3F3;--side:#F5E8E8;--card:#FFFFFF;--card2:#F8EDEE;--hover:#F1E1E2;--sunk:#FFFCFC;--sunk2:#FBF5F5;--chip:#F3E4E5;--ph:#EBD6D9;
  --line:#EFDFE0;--line2:#E5D0D3;--line3:#D9C0C4;--line4:#B89DA2;
  --ink:#2E2326;--ink2:#4D3E42;--ink3:#6E5C61;--mute:#8E7B80;--mute2:#C3AFB3;--prose:#3B2E32;--msg:#33282B;--em:#6E5C61;
  --acc:#C8507A;--acc2:#A93D63;--acc-bg:#FADDE7;--acc-soft:#FBE8EE;--acc-line:#EBB0C3;--acc-text:#9C2F57;--acc-ink:#FFF7F9;
  --teal:#2F8F86;--teal-bg:#D3EEEA;--teal-line:#95D2CA;--teal-text:#1F6E66;--red:#C24A4A;--red-bg:#FCEAEA;--red-line:#EDB4B4;
  --dlg:#FFFFFF;--dlg-line:#EFDFE0;--dim:rgba(70,40,50,.3);--topbar:rgba(251,243,243,.92);--shadow:rgba(120,60,80,.16);
  --quote:#FAEFF1;--memo:#FDF2F5;--drop-hover:#FCEBF0;--tog-off:#E5D0D3;--knob:#FFFFFF;--dot-off:#C3AFB3;--fc-dark:45%;--blur-op:.2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:var(--wb);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:var(--acc)}a:hover{color:var(--acc2)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.disp{font-family:var(--disp)}
:is(h1,h2,h3,.disp,.logo,.ttl,.vn,.legend,.fo-t,.mc-n,.mc-e,.stat b,.kv b){font-weight:var(--wd)}
[hidden]{display:none!important}

/* ---- 틀 ---- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:22px 14px 18px;display:flex;flex-direction:column;gap:4px}
/* 로고: 두툼한 책장(눈 달린 주인공 책 = 테마 강조색) + 검은고딕 '봇카이브.' */
.logo{display:flex;align-items:center;gap:9px;padding:4px 10px 18px;text-decoration:none;color:var(--ink);font-family:'Black Han Sans',var(--disp);font-weight:400;font-size:25px;letter-spacing:-.02em;line-height:1}
.logo i{color:var(--acc);font-style:normal}
.logo b{color:var(--acc);font-weight:400}
.logo .lgi{width:1.3em;height:1.3em;flex:none}
.lgi .l0{fill:var(--lg-bg)}.lgi .ls{fill:var(--lg-sh)}.lgi .l1{fill:var(--lg-b1)}.lgi .l2{fill:var(--lg-b2)}.lgi .l3{fill:var(--lg-b3)}.lgi .le{fill:var(--lg-bg)}
:root,[data-theme=night]{--lg-bg:#22222A;--lg-sh:#8A8890;--lg-b1:#F2B655;--lg-b2:#5EC2B7;--lg-b3:#B9A6F5}
[data-theme=day]{--lg-bg:#2B2620;--lg-sh:#A89A86;--lg-b1:#E9A646;--lg-b2:#4FB3A6;--lg-b3:#A994EE}
[data-theme=dawn]{--lg-bg:#1A2235;--lg-sh:#7F8AA1;--lg-b1:#8FB8E8;--lg-b2:#6FD0C4;--lg-b3:#F2B655}
[data-theme=forest]{--lg-bg:#1B2620;--lg-sh:#81938A;--lg-b1:#A8D27C;--lg-b2:#6CCFB4;--lg-b3:#F2B655}
[data-theme=sakura]{--lg-bg:#3A2C30;--lg-sh:#B79EA4;--lg-b1:#EE86A8;--lg-b2:#5FC1B4;--lg-b3:#A994EE}
.nav{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:10px;color:var(--ink2);text-decoration:none;font-weight:var(--wu)}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav[aria-current=page]{background:var(--acc-soft);color:var(--acc)}
.nav svg{flex:none;opacity:.9}
.nav .n{margin-left:auto;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.nav .dot{width:10px;height:10px;border-radius:3px;flex:none}
.sideh{display:flex;align-items:center;justify-content:space-between;padding:18px 12px 6px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--mute)}
.sideh>span{display:flex;gap:2px}
.ford{display:flex;flex-direction:column;gap:6px}
.fdr{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border:1px solid var(--line2);border-radius:12px;background:var(--card2);cursor:grab;user-select:none}
.fdr.dragging{opacity:.5;border-style:dashed}
.fdr b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.fdr b .meta{margin-left:8px;font-weight:400}
.fdr .dot{width:10px;height:10px;border-radius:4px;flex:none}
.fgrip{color:var(--mute);letter-spacing:-2px;font-size:13px}
.fdr [data-mv] svg{transform:rotate(90deg)}
.fdr .dn svg{transform:rotate(-90deg)}
.fdr .ib:disabled{opacity:.3;cursor:default}
.ib{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--ink3);display:grid;place-items:center}
.ib:hover{background:var(--card2);color:var(--ink)}
.side .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line3);background:none;color:var(--ink);font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--line4);color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{background:var(--acc2);color:var(--acc-ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.ghost{border-color:transparent;color:var(--ink3)}
.btn.ghost:hover{background:var(--card2);color:var(--ink)}
.btn.danger{color:var(--red)}
.btn[disabled]{opacity:.5;cursor:default}
.main{min-width:0;padding:34px 44px 80px}
.wrap{max-width:1180px;margin:0 auto}
.topbar{display:none}

/* ---- 서재 ---- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:stretch;margin-bottom:34px}
.hero h1{margin:0 0 8px;font-family:var(--disp);font-size:38px;line-height:1.25}
.hero .sub{color:var(--ink3);margin:0 0 22px}
.stats{display:flex;gap:26px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--disp);font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.cont{position:relative;display:flex;gap:20px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden;text-decoration:none;color:var(--ink);min-height:200px}
.cont .bgblur{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.2);opacity:var(--blur-op);pointer-events:none}
.cont>*:not(.bgblur){position:relative}
.cont .cv{width:120px;flex:none}
.cont small{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--acc)}
.cont h2{margin:4px 0 6px;font-family:var(--disp);font-size:28px;line-height:1.25}
.cont p{margin:0;color:var(--ink3);font-size:14px}
.cont .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.toolbar h2{margin:0 12px 0 0;font-family:var(--disp);font-size:24px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pill{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line3);background:none;color:var(--ink2);font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.pill:hover{border-color:var(--line4)}
.pill[aria-pressed=true]{border-color:var(--acc);background:var(--acc-bg);color:var(--acc-text);font-weight:600}
.pill .c{font-size:12px;color:var(--mute)}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border-radius:12px;background:var(--card);border:1px solid var(--line2);color:var(--mute);flex:0 1 220px;min-width:150px}
.search input{border:0;background:none;outline:0;color:var(--ink);width:100%;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gmin,176px),1fr));gap:22px 18px}
.bc{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink);min-width:0}
.bc:hover .cv{transform:translateY(-3px);box-shadow:0 14px 30px var(--shadow)}
.cv{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--ph);display:grid;place-items:center;transition:transform .2s,box-shadow .2s;border:1px solid rgba(255,255,255,.04)}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.cv .ph{font-family:var(--disp);font-size:52px;color:rgba(255,255,255,.75)}
.where{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;background:rgba(10,10,12,.72);backdrop-filter:blur(6px);font-size:11.5px;font-weight:600;color:#E4E1EA}
.where i{width:7px;height:7px;border-radius:50%;background:var(--dot-off)}
.where.on i{background:var(--teal)}
.st{position:absolute;right:8px;bottom:8px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:rgba(10,10,12,.72);backdrop-filter:blur(6px)}
.cc{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:999px;font-size:13px;font-weight:700;color:var(--acc-ink);background:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.35)}
.bc b{font-size:15.5px;font-weight:var(--wc);line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bc .who{font-size:12.5px;color:var(--mute);margin-top:-6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl{display:flex;gap:5px;flex-wrap:wrap}
.fd{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink3)}
.fd i{width:8px;height:8px;border-radius:2px}
.meta{font-size:12px;color:var(--mute)}
.empty{padding:60px 20px;border:1px dashed var(--line3);border-radius:20px;text-align:center;color:var(--ink3)}
.empty h3{margin:0 0 6px;font-family:var(--disp);font-size:22px;color:var(--ink)}
.empty p{margin:0 0 18px}

/* ---- 봇 페이지 ---- */
.bhero{position:relative;display:flex;gap:30px;padding:28px;border-radius:24px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin-bottom:22px}
.bhero .bgblur{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.2);opacity:var(--blur-op);pointer-events:none}
.bhero>*:not(.bgblur){position:relative}
.bhero .cv{width:190px;flex:none;cursor:pointer}
.bhero h1{margin:0;font-family:var(--disp);font-size:40px;line-height:1.2}
.bhero .who{color:var(--ink3);margin:4px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;text-decoration:none;border:1px solid}
/* 폴더 색: 밝은 테마에선 글자를 어둡게 섞어 읽히게 */
.fc{color:color-mix(in srgb,var(--fc),#000 var(--fc-dark));border-color:color-mix(in srgb,var(--fc) 35%,transparent);background:color-mix(in srgb,var(--fc) 9%,transparent)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bhero .row+.row{margin-top:12px}
.tog{display:inline-flex;align-items:center;gap:10px;min-height:38px;padding:0 14px 0 6px;border-radius:999px;border:1px solid var(--line3);background:none;color:var(--ink2);font-size:13.5px}
.tog i{width:34px;height:20px;border-radius:999px;background:var(--tog-off);position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--knob);transition:transform .15s,background .15s}
.tog[aria-pressed=true]{border-color:var(--teal-line);color:var(--teal-text)}
.tog[aria-pressed=true] i{background:var(--teal-bg)}
.tog[aria-pressed=true] i::after{transform:translateX(14px);background:var(--teal)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.tab{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 16px;color:var(--ink3);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current=page]{color:var(--ink);border-bottom-color:var(--acc)}
.tab .c{font-size:12px;color:var(--mute);font-weight:500}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.box+.box{margin-top:16px}
.box h3{margin:0 0 12px;font-size:14px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:8px}
.box h3 .ib{margin-left:auto;width:30px;height:30px}
.lk{display:block;padding:10px 0;border-top:1px solid var(--line)}
.lk:first-of-type{border-top:0;padding-top:0}
.lk a{font-weight:600;text-decoration:none;word-break:break-all}
.lk p{margin:2px 0 0;font-size:13px;color:var(--ink3);white-space:pre-wrap}
.lk .row{justify-content:space-between;flex-wrap:nowrap;align-items:flex-start}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv div{padding:12px;border-radius:12px;background:var(--sunk2);border:1px solid var(--line)}
.kv b{display:block;font-family:var(--disp);font-size:22px;line-height:1.2}
.kvb{padding:12px;border-radius:12px;background:var(--sunk2);border:1px solid var(--line);text-align:left;color:inherit;font:inherit;cursor:pointer;transition:border-color .15s}
.kvb:hover{border-color:var(--acc)}.kvb span{font-size:12px;color:var(--acc)}
.backbtn{display:inline-flex;align-items:center;gap:6px;margin:0 0 12px -6px;padding:6px 12px 6px 8px;border:0;border-radius:999px;background:none;color:var(--ink3);font:inherit;font-size:14px;font-weight:var(--wu);cursor:pointer}
a.backbtn{text-decoration:none}
.backbtn:hover{background:var(--hover);color:var(--ink)}
.peekseg{margin-bottom:12px}
.lsrc{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:18px 0 8px;font-size:15px}
.lsrc:first-child{margin-top:0}
.pk-top{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.lore{display:flex;flex-direction:column;gap:6px}
.le{border:1px solid var(--line);border-radius:12px;background:var(--sunk2)}
.lfold{border:1px solid var(--line2);border-radius:14px;padding:2px 0}
.lfold>summary{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer;list-style:none;color:var(--acc)}
.lfold>summary::-webkit-details-marker{display:none}
.lfold>summary b{color:var(--ink)}
.lfold>.lore{padding:0 10px 10px}
.le.off{opacity:.6}
.le summary{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;cursor:pointer;list-style:none}
.le summary::-webkit-details-marker{display:none}
.le summary b{font-size:14.5px}
.le .badge.off{background:var(--chip);color:var(--mute)}
.lk-keys{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.lk-keys i{font-style:normal;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--ink3)}
.le pre{margin:0;padding:4px 14px 14px;white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13.5px;line-height:1.7;color:var(--ink2);max-height:420px;overflow:auto}
.le>.meta{padding:0 14px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.at{margin:0;cursor:zoom-in;min-width:0}
.at img,.at video,.at .aud{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--ph);display:grid;place-items:center}
.at figcaption{font-size:12px;color:var(--ink3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv span{font-size:12px;color:var(--mute)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--ink3);font-size:12px}
details.notes{margin-top:12px;font-size:13.5px;color:var(--ink2)}
details.notes summary{cursor:pointer;color:var(--ink3);font-weight:600}
details.notes div{margin-top:8px;white-space:pre-wrap;max-height:340px;overflow:auto;padding-right:6px}
.memo-pre{white-space:pre-wrap;font-size:14px;color:var(--ink2);max-height:180px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent)}

/* 소개글 */
.article{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 32px}
.ahead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.ahead h2{margin:0;font-family:var(--disp);font-size:26px;line-height:1.3}
.ahead .meta{margin-top:4px}
.prose{font-size:15.5px;line-height:1.8;color:var(--prose);overflow-wrap:anywhere}
.prose img,.prose video{max-width:100%;height:auto;border-radius:10px;display:inline-block;vertical-align:middle}
.prose img.emoji{height:1.25em;width:auto;border-radius:0;vertical-align:-.25em;margin:0 .05em}
.prose p{margin:0 0 .2em;min-height:1em}
.prose blockquote{margin:12px 0;padding:8px 16px;border-left:3px solid var(--acc);background:var(--quote);border-radius:0 10px 10px 0}
/* 글에 박힌 표·그림 크기(820px 등)가 칸을 넘지 않게 — 표는 칸 폭에 맞추고 그림은 칸 안에서 비율대로 줄임 */
:is(.prose,.paste) table{border-collapse:collapse;display:table;width:100%!important;table-layout:auto}
:is(.prose,.paste) :is(td,th){width:auto!important;min-width:0!important}
:is(.prose,.paste) :is(td,th) :is(img:not(.emoji),video){width:auto!important;max-width:100%!important;height:auto!important}
.prose td,.prose th{border:1px solid var(--line2);padding:6px 10px}
.prose hr{border:0;border-top:1px solid var(--line2);margin:20px 0}
.prose a{word-break:break-all}
.prose .miss{display:inline-block;padding:4px 10px;border-radius:8px;background:var(--chip);color:var(--mute);font-size:13px}
.prose span[style*="color"]:not([style*="background"]){filter:brightness(1.15)}
.prose *,.paste *{box-sizing:border-box;max-width:100%}
.realm-in{display:flex;gap:8px}.realm-in .inp{flex:1;min-width:0;min-height:40px}
.realm-st{margin:6px 0 0}
.paste *{position:static!important;transform:none!important}
.bmk{display:inline-block;padding:1px 9px;border-radius:999px;background:var(--acc-soft);color:var(--acc);font-weight:600;text-decoration:none;cursor:grab}
.imp{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.imp .box h3{font-family:var(--disp);font-size:19px;color:var(--ink)}
.imp p{margin:0 0 12px;font-size:13.5px;color:var(--ink3)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink3)}
.inp{min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);color:var(--ink);font-size:15px;font-weight:400;width:100%}
textarea.inp{padding:10px 12px;min-height:110px;resize:vertical;line-height:1.6}
.inp:focus{border-color:var(--acc-line);outline:0}
.paste{min-height:220px;max-height:60vh;overflow:auto;padding:14px;border-radius:12px;border:1px dashed var(--line3);background:var(--sunk);font-size:14px}
.paste:empty::before{content:attr(data-ph);color:var(--mute)}
.paste img{max-width:200px;height:auto}

/* 채팅 */
.chats{display:flex;flex-direction:column;gap:10px}
.ch{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.ch:hover{border-color:var(--line3)}
.ch .cv{width:46px;border-radius:10px;flex:none}
.ch .cv .ph{font-size:20px}
.ch b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .meta{display:flex;gap:10px;flex-wrap:wrap}
.ch .star{margin-left:auto;color:var(--acc);font-size:13px;font-weight:600;white-space:nowrap}
.cv-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
.clist{position:sticky;top:20px;display:flex;flex-direction:column;gap:6px;max-height:calc(100vh - 40px);overflow:auto}
.clist a{display:block;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink2);border:1px solid transparent}
.clist a:hover{background:var(--hover)}
.clist a[aria-current=page]{background:var(--card);border-color:var(--line2);color:var(--ink)}
.clist a b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chead{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:16px}
.chead .tt{flex:1;min-width:240px}
.ttl{width:100%;border:0;background:none;font-family:var(--disp);font-size:28px;color:var(--ink);padding:2px 0;border-bottom:1px solid transparent}
.ttl:hover,.ttl:focus{border-bottom-color:var(--line3);outline:0}
.cbar .cbk{display:none;flex:none;width:36px;height:36px;border-radius:999px;border:1px solid var(--line3);color:var(--ink2)}
.cbar.stuck .cbk{display:grid}
.cbar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;background:linear-gradient(var(--bg) 80%,transparent)}
.msgs{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.msg{display:flex;gap:12px;align-items:flex-start;content-visibility:auto;contain-intrinsic-size:auto 160px}
.msg .av{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;background:var(--ph);display:grid;place-items:center;font-family:var(--disp);font-size:16px}
.msg .av img{width:100%;height:100%;object-fit:cover}
/* 읽기 화면 (리더): 넓은 한 단, 봇 글은 말풍선 없이 책처럼 */
.reader{max-width:880px;margin:0 auto}
.rd-top{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.rd-top .ib.danger{color:var(--danger,#d9534f)}
.reader .ttl{font-size:30px}
.rd-memo{margin:12px 0 4px}
.rd-memo>summary{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink3);font-size:13.5px;list-style:none}
.rd-memo>summary::-webkit-details-marker{display:none}
.rd-memo textarea{margin-top:8px;min-height:72px}
.rd-opts{display:flex;align-items:center;gap:4px;margin-left:auto}
.rd-opts .ib{font-size:13px;font-weight:700;width:34px;height:34px}
.reader .msgs{gap:6px}
.reader .msg.c .bub{max-width:100%;flex:1;padding:14px 4px 18px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.reader .msg.c .av{margin-top:12px}
.reader .msg.marked.c .bub{box-shadow:none;border-left:3px solid var(--acc);padding-left:14px}
.reader .msg.u{margin:10px 0}
.reader .msg.u .bub{max-width:min(620px,90%)}
.reader .msg .tx{font-size:var(--rd,16px);line-height:1.9}
.reader .msg .tx h4{margin:14px 0 6px;font-family:var(--disp);font-size:1.15em;color:var(--ink)}
.reader .msg .tx hr{border:0;border-top:1px dashed var(--line3);margin:16px 0}
img.emo{display:block;max-width:min(300px,100%);max-height:380px;width:auto;margin:12px 0;border-radius:14px;background:var(--ph);cursor:zoom-in}
.thought{margin:0 0 10px;border-radius:10px;background:var(--sunk2);border:1px dashed var(--line2);font-size:.9em}
.thought>summary{padding:6px 12px;cursor:pointer;color:var(--mute);list-style:none}
.thought>summary::-webkit-details-marker{display:none}
.thought>summary span{font-size:.85em;margin-left:4px}
.thought .th-b{padding:0 14px 12px;color:var(--ink3);line-height:1.7}
.reader .msg .tx p{margin:0 0 .75em}
.reader .msg .tx p:last-child{margin-bottom:0}
.stc,.thought{display:block;width:auto;text-align:left}
.stc{margin:12px 0 4px;border-radius:12px;border:1px solid var(--line2);background:var(--sunk2);font-size:.88em;line-height:1.6}
.stc>summary{padding:8px 12px;cursor:pointer;font-weight:600;color:var(--ink2);list-style:none}
.stc>summary::-webkit-details-marker{display:none}
.st-b{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.st-i,.st-tag{padding:2px 10px;border-radius:999px;background:var(--chip);color:var(--ink2)}
.st-tag{background:var(--acc-soft);color:var(--acc)}
.st-row{flex-basis:100%;color:var(--ink2)}
.st-say{flex-basis:100%;margin-top:4px;color:var(--acc-text);font-style:italic}
.rd-end{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 10px;padding:16px 0;border-top:1px solid var(--line)}
.rd-drawer{position:fixed;top:0;right:0;bottom:0;z-index:45;width:min(360px,92vw);padding:16px 14px;background:var(--card);border-left:1px solid var(--line2);box-shadow:-20px 0 50px var(--shadow);overflow:auto}
.rd-drawer[hidden]{display:none}
.rd-dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.rd-drawer .clist{position:static;max-height:none}
.msg .bub{position:relative;max-width:min(760px,100%);padding:12px 16px 12px;border-radius:4px 18px 18px 18px;background:var(--card);border:1px solid var(--line);min-width:0}
.msg .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-bottom:4px}
.msg .who b{color:var(--ink2);font-weight:600}
.msg .tx{font-size:15px;line-height:1.75;overflow-wrap:anywhere;color:var(--msg)}
.msg .tx .q{color:var(--acc-text)}
.msg .tx em{color:var(--em)}
.msg .tx blockquote{margin:6px 0;padding-left:12px;border-left:2px solid var(--line3)}
.msg .tx pre,.msg .tx code{white-space:pre-wrap;font-size:13px}
.asset{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--mute);font-size:12px;vertical-align:1px}
.msg.u{flex-direction:row-reverse}
.msg.u .bub{border-radius:18px 4px 18px 18px;background:var(--acc-soft);border-color:var(--acc-bg)}
.msg.u .who{justify-content:flex-end}
.mk{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--mute2);display:grid;place-items:center}
.msg.u .mk{right:auto;left:6px}
.msg:hover .mk{color:var(--ink3)}
.mk:hover{background:var(--chip);color:var(--acc)!important}
.msg.marked .bub{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.msg.flash .bub{animation:msgflash 2.6s ease-out}
@keyframes msgflash{0%,45%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.msg.flash .bub{animation:none;box-shadow:0 0 0 3px var(--acc)}}
.msg.marked .mk{color:var(--acc)}
.msg .who{padding-right:30px}
.msg.u .who{padding-right:0;padding-left:30px}
.mpanel{margin-top:12px;padding-top:12px;border-top:1px dashed var(--acc-line);display:flex;flex-direction:column;gap:8px}
.mpanel textarea{min-height:60px;background:var(--memo);border-color:var(--acc-bg)}
.mpanel .pic{position:relative;max-width:340px}
.mpanel .pic img{width:100%;border-radius:10px;display:block;cursor:zoom-in}
.mpanel .pic button{position:absolute;right:6px;top:6px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.scene{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--acc-bg);text-decoration:none;color:var(--ink)}
.scene img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.scene p{margin:0;font-size:13.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.scene .meta{display:flex;justify-content:space-between;gap:8px}

/* 자료 */
.files{display:flex;flex-direction:column}
.fr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fi{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;background:var(--chip);color:var(--ink3)}
.fr b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .note{font-size:13px;color:var(--ink3);white-space:pre-wrap}
.fr .acts{display:flex;gap:4px;align-items:center}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--acc-bg);color:var(--acc-text);margin-left:6px;vertical-align:2px}
.badge.old{background:var(--chip);color:var(--mute)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:26px;border-radius:16px;border:1.5px dashed var(--line3);color:var(--ink3);text-align:center;cursor:pointer;background:var(--sunk2)}
.drop:hover,.drop.over{border-color:var(--acc);color:var(--ink);background:var(--drop-hover)}
.drop b{color:var(--ink)}
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:24px}
.shelf{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.shelf[aria-current=page]{border-color:var(--acc);background:var(--acc-soft)}
.shelf b{font-weight:600}
.shelf span{font-size:12.5px;color:var(--mute)}
.shelf.add{border-style:dashed;color:var(--ink3);align-items:center;justify-content:center;flex-direction:row;font-weight:600;cursor:pointer}
.ktitle{margin:22px 0 6px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.drop.sm{flex-direction:row;flex-wrap:wrap;gap:4px 10px;padding:12px;margin-top:10px;border-radius:12px;font-size:13px}
/* 버전 */
.ver{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;overflow:hidden}
.ver.cur{border-color:var(--acc-line)}
.vh{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.vh:hover{background:var(--hover)}
.vchev{display:grid;place-items:center;color:var(--mute);transform:rotate(-90deg);transition:transform .15s;flex:none}
.ver.open .vchev{transform:rotate(90deg)}
.vn{font-family:var(--disp);font-size:18px}
.vh .meta{display:block;margin-top:2px}
.vh .acts{display:flex;gap:4px;align-items:center;flex:none}
.vbody{display:none;padding:0 16px 16px 44px}
.ver.open .vbody{display:block}
.vnote{margin:0 0 8px;padding:10px 14px;border-radius:12px;background:var(--sunk2);border:1px solid var(--line);font-size:14px;color:var(--ink2);white-space:pre-wrap}
.vlist{display:flex;flex-direction:column;gap:6px}
.vlist:empty{display:none}
.vf{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--card2);border:1px solid var(--line)}
.vf b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vf .meta{display:block}
.vpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

const ITCOL = {};

  for (const [list, name, col] of [[S.state && S.state.statuses, STATUS, STCOL], [S.state && S.state.itypes, ITYPE, ITCOL], [S.state && S.state.stypes, STYPE, STYCOL], [S.state && S.state.ptypes, PTYPE, PTCOL]]) {

}

const itemFolders = () => (S.state.folders || []).filter(f => f.scope === 'item');

async function api(method, path, body) {
  const opt = {method, headers: {'X-BS': '1'}};
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  let d = null;
  try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && d && d.login) { showLogin(); const e = new Error(d.error); e.login = true; throw e; }
  if (!r.ok) throw new Error(d && d.error || `서버 오류 (${r.status})`);
  return d;
}
const upload = (file, params, onProg) => putFile('/api/upload?' + new URLSearchParams(params), file, onProg);
function putFile(url, file, onProg) {
  return new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open('PUT', url);
    x.setRequestHeader('X-BS', '1');
    x.upload.onprogress = e => e.lengthComputable && onProg && onProg(e.loaded / e.total);
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {} if (x.status === 401 && d.login) showLogin(); x.status < 300 ? res(d) : rej(new Error(d.error || `올리기 실패 (${x.status})`)); };
    x.onerror = () => rej(new Error('올리는 중 연결이 끊겼어요'));
    x.send(file);
  });
}

function ago(s) {
  if (!s) return '';
  const t = typeof s === 'number' ? s : Date.parse(s);
  const d = (Date.now() - t) / 1000;
  if (d < 60) return '방금';
  if (d < 3600) return `${Math.floor(d / 60)}분 전`;
  if (d < 86400) return `${Math.floor(d / 3600)}시간 전`;
  if (d < 86400 * 30) return `${Math.floor(d / 86400)}일 전`;
  return day(t);
}
function day(t) { const d = new Date(typeof t === 'number' ? t : Date.parse(t)); return `${d.getFullYear()}. ${d.getMonth() + 1}. ${d.getDate()}.`; }
function dayTime(t) { const d = new Date(typeof t === 'number' ? t : Date.parse(t)), p = n => String(n).padStart(2, '0'); return `${day(t)} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
function size(n) { return n > 1e9 ? (n / 1e9).toFixed(2) + 'GB' : n > 1e6 ? (n / 1e6).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1e3)) + 'KB'; }

async function shrink(blob, max = 1600, q = 0.86) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return c.toDataURL('image/webp', q);
}

function modal(html, cls = '') {
  const dim = document.createElement('div');
  dim.className = 'dim';
  dim.innerHTML = `<section class="dlg ${cls}" role="dialog" aria-modal="true">${html}</section>`;
  let downOut = false;
  dim.addEventListener('pointerdown', e => { downOut = e.target === dim; });
  dim.addEventListener('click', e => { if (e.target === dim && downOut) close(); });
  const key = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  function close() { dim.remove(); document.removeEventListener('keydown', key); if (dim.onclose) dim.onclose(); }
  dim.close = close;
  $$('[data-close]', dim).forEach(b => b.onclick = close);
  document.body.append(dim);
  const f = $('input:not([type=checkbox]):not([type=file]),textarea', dim);
  f && setTimeout(() => f.focus(), 30);
  return dim;
}

function drawImp() {

      ${(r.failed_styles || []).length ? `<p class="hint">파일이 깨져서 못 들인 그림체: ${h(r.failed_styles.join(', '))}</p>` : ''}` : ''}

async function runImport(file) {
  const show = (o) => { IMP = {...IMP, ...o}; drawImp(); };
  const wait = ms => new Promise(res => setTimeout(res, ms));
  IMP = {state: 'up', pct: 0, msg: '시작하는 중'};
  drawImp();
  window.addEventListener('beforeunload', impGuard);
  try {
    let {id, have} = await api('POST', '/api/import', {name: file.name, size: file.size, key: `${file.name}|${file.lastModified}`});
    const resumed = have > 0, CH = 16 << 20;
    let tries = 0;
    while (have < file.size) {  // 16MB씩 — 끊기면 서버가 받아 둔 데부터
      show({pct: have / file.size * 100, msg: `${resumed ? '이어서 ' : ''}올리는 중 · ${size(have)} / ${size(file.size)}`});
      let r = null, d = {};
      try {
        r = await fetch(`/api/import/${id}?at=${have}`, {method: 'PUT', headers: {'X-BS': '1'}, body: file.slice(have, Math.min(have + CH, file.size))});
        try { d = await r.json(); } catch (e) {}
      } catch (e) {}
      if (r && (r.ok || r.status === 409) && typeof d.have === 'number') { have = d.have; tries = 0; continue; }
      if (r && r.status === 401 && d.login) { showLogin(); throw new Error(d.error); }
      if (r && r.status < 500) throw new Error(d.error || `올리기 실패 (${r.status})`);
      if (++tries > 8) throw new Error('연결이 자꾸 끊겨요. 같은 파일을 다시 고르면 이어서 올려요.');
      show({msg: `연결이 끊겨서 다시 해 보는 중 (${tries}/8)`});
      await wait(Math.min(30000, 1500 * tries));
    }
    show({state: 'run', pct: 0, msg: '압축 파일을 살피는 중'});
    await api('POST', `/api/import/${id}/run`);
    for (;;) {
      await wait(1000);
      let j;
      try { j = await api('GET', `/api/import/${id}`); } catch (e) { if (e instanceof TypeError) continue; throw e; }
      if (j.state === 'error') throw new Error(j.msg);
      if (j.state === 'done') { IMP = {state: 'done', result: j.result}; break; }
      show({pct: j.total ? j.done / j.total * 100 : 0, msg: `${j.msg}${j.total ? ` · ${size(j.done)} / ${size(j.total)}` : ''}`});
    }
    drawImp();
    const r = IMP.result;
    toast(`들이기 끝 — 봇 ${r.bots} · 자료 ${r.items} · 그림체 ${r.styles}${r.skipped.length ? ` (건너뜀 ${r.skipped.length})` : ''}`);
    await loadState();
    route();
  } catch (e) {
    IMP = {state: 'error', msg: e.message || String(e)};
    drawImp();
    if (!$('[data-imp]')) fail(e);
  } finally {
    window.removeEventListener('beforeunload', impGuard);
  }
}

// ---- 카드 파일 읽기 (.charx · .png · .json) ----
const b64utf8 = s => new TextDecoder().decode(Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0)));
async function pngTexts(file) {
  const out = {}; let assets = 0, pos = 8;
  const sig = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  if (sig[0] !== 0x89 || sig[1] !== 0x50) return null;
  while (pos + 8 <= file.size) {
    const hd = new DataView(await file.slice(pos, pos + 8).arrayBuffer());
    const len = hd.getUint32(0);
    const type = String.fromCharCode(hd.getUint8(4), hd.getUint8(5), hd.getUint8(6), hd.getUint8(7));
    if (type === 'tEXt') {
      const kb = new Uint8Array(await file.slice(pos + 8, pos + 8 + Math.min(len, 80)).arrayBuffer());
      const z = kb.indexOf(0);
      const kw = new TextDecoder().decode(kb.slice(0, z < 0 ? kb.length : z));
      if (kw.startsWith('chara-ext-asset_')) assets++;
      else if (kw === 'ccv3' || kw === 'chara') out[kw] = await file.slice(pos + 8 + z + 1, pos + 8 + len).text();
    }
    if (type === 'IEND') break;
    pos += 12 + len;
  }
  return {texts: out, assets};
}
async function zipDir(file) {
  const tl = Math.min(file.size, 65557 + 22);
  const tail = new DataView(await file.slice(file.size - tl).arrayBuffer());
  let e = -1;
  for (let i = tl - 22; i >= 0; i--) if (tail.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error('zip 아님');
  const eAt = file.size - tl + e;  // 파일 안에서 EOCD 위치
  let cdSize = tail.getUint32(e + 12, true), cdOff = tail.getUint32(e + 16, true);
  // 그림 뒤에 zip을 이어 붙인 파일(.jpeg 카드)은 zip 안의 위치가 zip 시작 기준 → 실제 위치와의 차이(base)를 더함
  let base = eAt - cdSize - cdOff;
  if (cdOff === 0xFFFFFFFF && e >= 20 && tail.getUint32(e - 20, true) === 0x07064b50) {
    const r64 = Number(tail.getBigUint64(e - 12, true));
    base = (eAt - 20 - 56) - r64;
    const rec = new DataView(await file.slice(r64 + base, r64 + base + 56).arrayBuffer());
    cdSize = Number(rec.getBigUint64(40, true)); cdOff = Number(rec.getBigUint64(48, true));
  }
  if (base < 0) base = 0;
  const cd = new DataView(await file.slice(cdOff + base, cdOff + base + cdSize).arrayBuffer());
  const list = []; let p = 0;
  while (p + 46 <= cd.byteLength && cd.getUint32(p, true) === 0x02014b50) {
    const method = cd.getUint16(p + 10, true);
    let csize = cd.getUint32(p + 20, true), usize = cd.getUint32(p + 24, true), lho = cd.getUint32(p + 42, true);
    const nl = cd.getUint16(p + 28, true), xl = cd.getUint16(p + 30, true), cl = cd.getUint16(p + 32, true);
    const raw = new Uint8Array(cd.buffer, p + 46, nl);
    let name;
    try { name = new TextDecoder('utf-8', {fatal: true}).decode(raw); } catch (e) { name = new TextDecoder('euc-kr').decode(raw); }  // 한국어 윈도우 zip은 이름이 CP949
    let x = p + 46 + nl;
    while (x + 4 <= p + 46 + nl + xl) {
      const id = cd.getUint16(x, true), sz = cd.getUint16(x + 2, true);
      if (id === 1) { let q = x + 4; if (usize === 0xFFFFFFFF) { usize = Number(cd.getBigUint64(q, true)); q += 8; } if (csize === 0xFFFFFFFF) { csize = Number(cd.getBigUint64(q, true)); q += 8; } if (lho === 0xFFFFFFFF) lho = Number(cd.getBigUint64(q, true)); }
      x += 4 + sz;
    }
    list.push({name, method, csize, usize, lho: lho + base});
    p += 46 + nl + xl + cl;
  }
  return list;
}
async function zipRead(file, en) {
  const lh = new DataView(await file.slice(en.lho, en.lho + 30).arrayBuffer());
  const start = en.lho + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
  const blob = file.slice(start, start + en.csize);
  if (en.method === 0) return blob;
  if (en.method !== 8) throw new Error('모르는 압축 방식');
  return new Response(blob.stream().pipeThrough(new DecompressionStream('deflate-raw'))).blob();
}
function cardInfo(j, extra = {}) {
  const d = j && j.data ? j.data : (j || {});
  const book = d.character_book || {};
  const assets = extra.assets ?? (Array.isArray(d.assets) ? d.assets.filter(a => !(a.type === 'icon' && a.name === 'main')).length : 0);

    spec: j.spec || '', version: /^(undefined|null)$/.test(String(d.character_version)) ? '' : String(d.character_version || ''), tags: (Array.isArray(d.tags) ? d.tags : []).slice(0, 30).map(String),
    lore: Array.isArray(book.entries) ? book.entries.length : 0, assets,

async function readCard(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  // 확장자보다 파일 앞부분으로 판단 (.jpeg 카드 = JPEG 그림 + 뒤에 charx, 확장자만 .jpeg인 PNG 카드도 있음)
  const sig = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  const kind = sig[0] === 0x89 && sig[1] === 0x50 ? 'png' : sig[0] === 0xFF && sig[1] === 0xD8 ? 'jpeg'
    : sig[0] === 0x50 && sig[1] === 0x4B ? 'zip' : sig[0] === 0x7B || sig[0] === 0x5B || ext === 'json' ? 'json' : ext;
  let j = null, cov = null, extra = {};
  if (kind === 'png') {
    const t = await pngTexts(file);
    if (t && (t.texts.ccv3 || t.texts.chara)) { j = JSON.parse(b64utf8(t.texts.ccv3 || t.texts.chara)); extra.assets = t.assets || undefined; }
    cov = file;
  } else if (kind === 'zip' || kind === 'jpeg') {
    let dir = null;
    try { dir = await zipDir(file); } catch (e) { if (kind === 'zip') throw e; }
    const cj = dir && dir.find(x => x.name === 'card.json');
    extra.hasModule = !!(dir && dir.some(x => x.name === 'module.risum'));
    if (cj) {
      j = JSON.parse(await (await zipRead(file, cj)).text());
      const d = j.data || {};
      const icon = (d.assets || []).find(a => a.type === 'icon' && a.name === 'main') || (d.assets || []).find(a => a.type === 'icon');
      if (icon && /^embed+ed:\/\//.test(icon.uri || '')) {
        const path = icon.uri.replace(/^embed+ed:\/\//, '');
        const en = dir.find(x => x.name === path);
        if (en) cov = await zipRead(file, en).catch(() => null);
      }
    } else if (kind === 'zip') throw new Error('charx 안에 card.json이 없어요');
    else throw new Error('그림 안에 카드 정보가 없어요 — 그냥 그림 파일인 것 같아요');
    if (!cov && kind === 'jpeg') cov = file.slice(0, file.size, 'image/jpeg');
  } else if (kind === 'json') {
    j = JSON.parse(await file.text());
    if (j && (j.type === 'risuChat' || j.type === 'risuAllChats')) throw new Error('채팅 로그 파일이에요 — 봇 페이지의 채팅 로그에서 올려 주세요');
  }
  if (!j) return {name: file.name.replace(/\.[^.]+$/, ''), creator: '', info: {}, cover: cov ? await shrink(cov, 900).catch(() => null) : null};
  const d = j.data || j;
  // 모듈을 charx로 내보낸 파일: card.json은 껍데기(인사말 없음) + module.risum
  const module = /\.module\.charx$/i.test(file.name) || (extra.hasModule && !d.first_mes && !(d.alternate_greetings || []).length);
  return {name: String(d.name || file.name.replace(/\.[^.]+$/, '')), creator: String(d.creator || ''), info: cardInfo(j, extra), module,
          cover: cov ? await shrink(cov, 900).catch(() => null) : null};
}
const kindOf = name => {
  if (/\.module\.charx$/i.test(name)) return 'module';  // 리스는 모듈도 charx로 내보냄 (… .module.charx)
  const e = (name.split('.').pop() || '').toLowerCase();
  if (['charx', 'risuchar'].includes(e)) return 'card';
  if (e === 'risum') return 'module';
  if (['risup', 'risupreset', 'preset'].includes(e)) return 'preset';
  if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'zip', 'mp4', 'webm'].includes(e)) return 'images';
  if (['txt', 'md'].includes(e)) return 'memo';
  if (e === 'js') return 'plugin';
  return 'etc';
};

// 리스 랠름 주소 → 카드 파일 (서버가 받아서 그대로 넘겨 줌)
const REALM_ID = /realm\.risuai\.net\/character\/([0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12})/i;
async function realmFile(url, onProg) {
  const m = String(url || '').match(REALM_ID);
  if (!m) throw new Error('랠름 캐릭터 주소(realm.risuai.net/character/…)를 넣어 주세요');
  const r = await fetch(`/api/realm/${m[1]}`, {headers: {'X-BS': '1'}});
  if (!r.ok) { let d = null; try { d = await r.json(); } catch (e) {} throw new Error(d && d.error || `랠름에서 받지 못했어요 (${r.status})`); }
  const ext = r.headers.get('X-Ext') || 'charx';
  let file = new File(await readBody(r, onProg), `realm-${m[1].slice(0, 8)}.${ext}`);
  try { const c = await readCard(file); if (c.name) file = new File([file], `${fileSafe(c.name)}.${ext}`); } catch (e) {}
  return {file, url: `https://realm.risuai.net/character/${m[1].toLowerCase()}`};
}
// 받는 응답을 조각으로 모음 (받은 크기를 onProg로 알림)
async function readBody(r, onProg) {
  const total = +r.headers.get('Content-Length') || 0, reader = r.body.getReader(), parts = [];
  let got = 0;
  for (;;) {
    const {done, value} = await reader.read();
    if (done) break;
    parts.push(value); got += value.length;
    if (onProg) onProg(got, total);
  }
  return parts;
}

// ---- 아카 글 붙여넣기: 글 속 링크(랠름·구글 드라이브·드롭박스 …)와 그림에서 봇 파일을 찾아 받고, 붙여넣은 글은 소개글로 ----
const BOT_EXT = /\.(charx|risum|risup|risupreset|json|png|jpe?g|zip)$/i;
// 아카는 바깥 링크를 unsafelink.com/<원래 주소>로 감쌈
function unwrapLink(u) {
  u = String(u || '').trim().replace(/[.,)\]>'"]+$/, '');
  if (u.startsWith('//')) u = 'https:' + u;
  const m = u.match(/^https?:\/\/(?:www\.)?unsafelink\.com\/(.+)$/i);
  if (m) { u = m[1]; if (/^https?%3A/i.test(u)) try { u = decodeURIComponent(u); } catch (e) {} }
  return u;
}
// 링크 하나 → {kind: realm|file|link, label, url(보관할 주소), get(받을 주소), why(못 받는 까닭)} — 봇 파일과 상관없는 링크는 null
function linkSource(raw) {
  const u = unwrapLink(raw);
  let x;
  try { x = new URL(u); } catch (e) { return null; }
  if (!/^https?:$/.test(x.protocol)) return null;
  const host = x.hostname.replace(/^www\./, ''), path = x.pathname;
  let m;
  if (/(^|\.)(arca\.live|namu\.la)$/.test(host)) return null;  // 아카 다른 글·그림은 따로
  if ((m = u.match(REALM_ID))) return {kind: 'realm', label: '랠름', url: `https://realm.risuai.net/character/${m[1].toLowerCase()}`};
  if (host === 'drive.google.com') {
    const id = (path.match(/\/file\/d\/([\w-]{10,})/) || [])[1] || (!/\/folders\//.test(path) && x.searchParams.get('id'));
    return id ? {kind: 'file', label: '구글 드라이브', url: u, get: `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`}
      : {kind: 'link', label: '구글 드라이브', url: u, why: '폴더 링크라 직접 받아야 해요'};
  }
  if (/(^|\.)dropbox\.com$/.test(host) && /^\/(s|scl)\//.test(path)) { x.searchParams.set('dl', '1'); return {kind: 'file', label: '드롭박스', url: u, get: x.href}; }
  if (host === 'pixeldrain.com' && (m = path.match(/^\/u\/(\w+)/))) return {kind: 'file', label: '픽셀드레인', url: u, get: `https://pixeldrain.com/api/file/${m[1]}?download`};
  if (/^mega\.(nz|io|co\.nz)$/.test(host)) return MEGA_FILE.test(u) ? {kind: 'mega', label: 'MEGA', url: u}
    : {kind: 'link', label: 'MEGA', url: u, why: /\/folder\//.test(path) ? '메가 폴더 링크라 직접 받아야 해요' : '푸는 열쇠(# 뒤)가 빠진 링크예요'};
  if (host === 'drive.proton.me' && /^\/urls\/\w+/.test(path)) return x.hash.length > 1 ? {kind: 'proton', label: '프로톤 드라이브', url: u}
    : {kind: 'link', label: '프로톤 드라이브', url: u, why: '암호(# 뒤)가 빠진 링크예요'};
  if (host === 'github.com' && (m = path.match(/^\/([^/]+\/[^/]+)\/blob\/(.+)$/))) return {kind: 'file', label: '깃허브', url: u, get: `https://raw.githubusercontent.com/${m[1]}/${m[2]}`};
  if (/^(chub\.ai|characterhub\.org)$/.test(host) && (m = path.match(/^\/characters\/([^/]+\/[^/?#]+)/))) return {kind: 'file', label: 'chub', url: u, get: `https://avatars.charhub.io/avatars/${m[1]}/chara_card_v2.png`};
  // png·jpg 주소는 글 속 그림에 걸린 링크인 경우가 많아서 꺼 둔 채로 (카드 그림이면 켜서 받기)
  if (BOT_EXT.test(path)) return {kind: 'file', label: host, url: u, get: x.href.replace(/^http:/, 'https:'), pic: /\.(png|jpe?g)$/i.test(path)};
  return null;
}
// 붙여넣은 글 → 받을 링크 목록 (아카 자체 링크·그림은 빼고 — 아카 그림은 원본도 webp라 카드 정보가 거의 안 남음)
function arcaScan(box) {
  const doc = new DOMParser().parseFromString(box.innerHTML, 'text/html');
  const urls = [...doc.querySelectorAll('a[href]')].map(a => a.getAttribute('href')).concat(box.innerText.match(/https?:\/\/[^\s<>"']+/g) || []);
  const seen = new Set(), links = [];
  for (const u of urls) {
    const s = linkSource(u);
    if (s && !seen.has(s.get || s.url)) { seen.add(s.get || s.url); links.push(s); }
  }
  return links;
}
// 링크의 파일 받기 — stall 동안 한 조각도 안 오면 그만둠 (아카 그림 서버는 주소가 틀리면 답 없이 붙잡고 있음)
async function grabFile(url, onProg, stall = 60000) {
  const ac = new AbortController();
  let timer = setTimeout(() => ac.abort(), stall);
  try {
    const r = await fetch('/api/grab?u=' + encodeURIComponent(url), {headers: {'X-BS': '1'}, signal: ac.signal});
    if (!r.ok) { let d = null; try { d = await r.json(); } catch (e) {} throw new Error(d && d.error || `받지 못했어요 (${r.status})`); }
    let name = 'file';
    try { name = decodeURIComponent(r.headers.get('X-Name') || 'file'); } catch (e) {}
    return new File(await readBody(r, (n, t) => { clearTimeout(timer); timer = setTimeout(() => ac.abort(), stall); if (onProg) onProg(n, t); }), name);
  } catch (e) {
    throw e.name === 'AbortError' ? new Error('답이 없어서 그만뒀어요') : e;
  } finally { clearTimeout(timer); }
}
// ---- 메가 공개 파일: 링크 # 뒤 열쇠로 브라우저에서 풂 (서버는 받을 주소만 물어 옴) ----
const MEGA_FILE = /mega\.(?:nz|io|co\.nz)\/(?:file\/([\w-]{8})#([\w-]{43})|#!([\w-]{8})!([\w-]{43}))/;
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), c => c.charCodeAt(0));
// 메가 이름은 AES-CBC + 0으로 채움 → 웹 암호화는 PKCS7만 받으니 맞는 채움 블록을 하나 만들어 붙이고 풂
async function cbcNoPad(k, data) {
  const key = await crypto.subtle.importKey('raw', k, 'AES-CBC', false, ['encrypt', 'decrypt']);
  const pad = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-CBC', iv: data.slice(-16)}, key, new Uint8Array(16).fill(16))).slice(0, 16);
  const all = new Uint8Array(data.length + 16);
  all.set(data); all.set(pad, data.length);
  return new Uint8Array(await crypto.subtle.decrypt({name: 'AES-CBC', iv: new Uint8Array(16)}, key, all));
}
async function megaFile(url, onProg) {
  const m = String(url).match(MEGA_FILE);
  if (!m) throw new Error('메가 파일 링크(mega.nz/file/…#열쇠)만 받을 수 있어요');
  const key = b64u(m[2] || m[4]);
  if (key.length !== 32) throw new Error('메가 열쇠가 깨졌어요');
  const k = key.slice(0, 16).map((b, i) => b ^ key[i + 16]), iv = new Uint8Array(16);
  iv.set(key.slice(16, 24));
  const r = await fetch(`/api/mega/${m[1] || m[3]}`, {headers: {'X-BS': '1'}});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `메가에서 못 받았어요 (${r.status})`);
  let name = 'mega-file';
  try {
    const t = new TextDecoder().decode(await cbcNoPad(k, b64u(d.at))).replace(/\0+$/, '');
    if (t.startsWith('MEGA')) name = JSON.parse(t.slice(4)).n || name;
  } catch (e) {}
  const enc = await grabFile(d.g, onProg);
  const ck = await crypto.subtle.importKey('raw', k, 'AES-CTR', false, ['decrypt']);
  return new File([await crypto.subtle.decrypt({name: 'AES-CTR', counter: iv, length: 64}, ck, await enc.arrayBuffer())], name);
}
// ---- 프로톤 드라이브 공개 링크: 프로톤 SDK 묶음(/proton.js)을 그때 불러와 브라우저에서 풂, 프로톤 API 요청은 서버가 대신 보냄 ----
let protonLib = null;
const loadProton = () => protonLib || (protonLib = new Promise((ok, no) => {
  const s = document.createElement('script');
  s.src = '/proton.js';
  s.onload = () => window.BKProton ? ok(window.BKProton) : no(new Error('프로톤 받기 도구가 이상해요'));
  s.onerror = () => { protonLib = null; no(new Error('프로톤 받기 도구를 못 불러왔어요')); };
  document.head.append(s);
}));
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); };
async function protonRelay(req, appVersion) {
  const headers = {};
  req.headers.forEach((v, k) => { headers[k] = v; });
  headers['x-pm-appversion'] = appVersion;
  let body = null;
  if (req.json) { headers['content-type'] = 'application/json'; body = new TextEncoder().encode(JSON.stringify(req.json)); }
  else if (req.body) body = new Uint8Array(await new Response(req.body).arrayBuffer());
  const signal = req.timeoutMs > 0 ? (req.signal ? AbortSignal.any([req.signal, AbortSignal.timeout(req.timeoutMs)]) : AbortSignal.timeout(req.timeoutMs)) : req.signal;
  const r = await fetch('/api/proton', {method: 'POST', signal, headers: {'X-BS': '1', 'Content-Type': 'application/json'},
    body: JSON.stringify({url: req.url, method: req.method, headers, body: body ? toB64(body) : ''})});
  if (!r.headers.get('X-Proton')) { const d = await r.json().catch(() => ({})); throw new Error(d.error || `프로톤에 못 보냈어요 (${r.status})`); }
  return new Response([101, 204, 205, 304].includes(r.status) ? null : r.body, {status: r.status, headers: {'content-type': r.headers.get('content-type') || ''}});
}
// 프로톤 링크 → 파일 목록 [{name, path, size, get}] (폴더면 하위 폴더 3단계까지) — 받기 전에 고르게 함
async function protonList(url, password) {
  const lib = await loadProton();
  try { return await lib.open(url, password, protonRelay); } catch (e) {
    throw e.needPassword ? new Error(password ? '암호가 틀렸어요' : '암호가 걸린 링크예요 — 위 칸에 암호를 넣어 주세요') : e;
  }
}
const pdirOf = path => path.includes('/') ? path.slice(0, path.lastIndexOf('/')) : '';
// 받은 .zip 안의 봇 파일 → File 목록 (봇 파일이 없으면 null — zip 그대로 둠)
async function unzipBot(file) {
  let list;
  try { list = await zipDir(file); } catch (e) { return null; }
  const want = list.filter(en => !en.name.endsWith('/') && !/(^|\/)(__MACOSX|\.)/.test(en.name) && /\.(charx|risum|risup|risupreset|json|png|jpe?g|txt|md)$/i.test(en.name));
  if (!want.length) return null;
  const out = [];
  for (const en of want) out.push(new File([await zipRead(file, en)], en.name.split('/').pop()));
  return out;
}

// 파일 하나 종류 정하기: 카드 · 모듈 · 채팅 로그 · 그 밖 (확장자보다 내용으로)
async function scanOne(x) {

    try {
      const c = await readCard(x.file);

const verCmp = (a, b) => String(a.card.info.version || '').localeCompare(String(b.card.info.version || ''), 'ko', {numeric: true})
  || a.path.localeCompare(b.path, 'ko', {numeric: true}) || a.file.lastModified - b.file.lastModified;
// 봇으로 나누기: 카드 이름이 같으면 한 봇(카드 여러 장 = 버전), 나머지 파일은 가장 가까운 봇 폴더로

    if (!g) { const nm = normName(x.file.name); g = bots.find(o => o.shared && d === o.root && normName(o.name).length > 1 && nm.includes(normName(o.name))); }

  const fnames = new Map(botFolders().map(f => [normName(f.name), f.id]));
  for (const g of bots) {
    const cards = g.items.filter(x => x.kind === 'card').sort(verCmp);
    for (const x of g.items) {
      if (x.kind === 'card') { x.ver = x; continue; }
      const d = dirOf(x.path);
      const own = cards.filter(c => under(d, dirOf(c.path)) && (cards.length === 1 || dirOf(c.path) !== g.root));
      x.ver = cards.length === 1 ? cards[0] : own.length ? own.sort((a, b) => dirOf(b.path).length - dirOf(a.path).length || verCmp(b, a))[0] : null;

    for (const x of g.items) dirOf(x.path).split('/').forEach(s => { const id = fnames.get(normName(s)); if (id) g.folders.add(id); });

const DKIND = {card: '카드', module: '모듈', preset: '프리셋', chat: '채팅 로그', images: '그림', memo: '메모', plugin: '플러그인', etc: '기타'};
function dirVerName(x, g, cards) {  // 버전 폴더 이름(카드·v2 같은 칸 이름은 빼고) → 없으면 카드 버전 → 겹치면 파일 이름

async function dirImport(list) {

    $('#diBody', m).innerHTML = `<p class="hint">카드 이름으로 봇을 나눴어요. 잘못 묶인 파일은 '파일 보기'에서 옮기고, 같은 봇이 둘로 나뉘었으면 합치세요.</p>
      <div class="dil">${bots.map(g => {
        const cards = g.items.filter(x => x.kind === 'card').sort(verCmp), top = cards[cards.length - 1];
        const cnt = {}; g.items.forEach(x => cnt[x.kind] = (cnt[x.kind] || 0) + 1);
        const msgs = g.items.filter(x => x.chats).reduce((s, x) => s + x.chats.length, 0);
        const sum = [cards.length > 1 ? `버전 ${cards.length}` : '', ...Object.entries(cnt).map(([k, n]) => k === 'chat' ? `채팅 로그 ${msgs}` : `${DKIND[k] || k} ${n}`)].filter(Boolean).join(' · ');

            </select></div>
          ${g.exists && g.action.startsWith('have:') ? `<p class="hint dix">서재에 같은 이름의 봇이 있어서 거기에 더해요. 이미 있는 파일·로그는 건너뛰어요.</p>` : ''}

// 실제로 들이기: 봇 만들기 → 카드마다 버전 → 나머지 파일 → 채팅 로그. 서재에 있는 봇에 더할 땐 같은 파일·로그는 건너뜀
async function dirRun(m, bots) {
  const ok = $('#diOk', m);
  ok.disabled = true;
  $('footer [data-close]', m).hidden = true;
  const total = bots.reduce((s, g) => s + g.items.length, 0);
  let done = 0, made = 0, skipped = 0;
  const errs = [];
  $('#diBody', m).innerHTML = `<p class="hint" id="diSt">들이는 중…</p><div class="prog"><i id="diBar"></i></div><div class="dierr" id="diErr"></div>`;
  const st = t => { $('#diSt', m).textContent = t; $('#diBar', m).style.width = (done / Math.max(total, 1) * 100) + '%'; };
  const err = (x, e) => { errs.push(`${x ? x.path : ''}: ${e.message}`); $('#diErr', m).innerHTML = errs.slice(-6).map(t => `<p>${h(t)}</p>`).join(''); };

          const v = await api('POST', '/api/versions', {bot_id: bid, name: dirVerName(x, g, cards), info: x.card.info, current: x === top});
          vids.set(x, v.id);
          await upload(x.file, {bot: bid, version: v.id, kind: 'card', name: x.file.name}, p => $('#diBar', m).style.width = ((done + p) / total * 100) + '%');
        }
      } catch (e) { err(x, e); }
      done++;

    for (const x of g.items.filter(x => x.kind !== 'card')) {
      st(`${g.name} · ${x.file.name}`);
      try {
        if (x.chats) {
          for (const c of x.chats) {
            if (oldChats.has(`${c.title}|${c.msgs.length}`)) { skipped++; continue; }
            await api('POST', '/api/chats', {bot_id: bid, title: c.title, memo: c.memo, source: x.path, messages: c.msgs});
          }
        } else if (dup(x)) skipped++;
        else {
          const vid = x.ver && vids.get(x.ver);
          await upload(x.file, {bot: bid, kind: x.kind, name: x.file.name, ...(vid ? {version: vid} : {})},
            p => $('#diBar', m).style.width = ((done + p) / total * 100) + '%');
        }
      } catch (e) { err(x, e); }
      done++;
    }
    const added = g.items.reduce((s, x) => s + (x.chats ? x.chats.length : 1), 0) > skipped - skip0;  // 있던 봇은 새로 들어간 게 있을 때만 다시 '정리 전'으로
    if (old && !old.inbox && added) await api('PUT', `/api/bots/${bid}`, {inbox: true, ...(g.folders.size ? {folders: [...new Set([...old.folders, ...g.folders])]} : {})}).catch(() => {});
  }

  await loadState();

}

// ---- 정리 전: 폴더째 들인 봇을 하나씩 (여러 개 골라 한꺼번에도) 폴더·상태·태그 정하기 ----
async function viewInbox() {
  const all = (await api('GET', '/api/bots')).filter(b => b.inbox).sort((a, b) => a.id - b.id);
  const view = $('#view');
  if (!all.length) {
    view.innerHTML = `<div class="wrap"><div class="empty"><h3>정리할 봇이 없어요</h3><p>폴더째 들인 봇은 여기 모였다가, 정리를 끝내면 서재로 들어가요.</p>
      <a class="btn" href="#/all">서재 전체로</a></div></div>`;
    return;
  }
  let cur = all[0].id;
  const picked = new Set();
  const draw = () => {
    const sel = picked.size > 1 ? all.filter(b => picked.has(b.id)) : [all.find(b => b.id === cur) || all[0]];
    const one = sel.length === 1 ? sel[0] : null;
    const chosen = new Set(one ? one.folders : []);
    let status = one ? one.status : '';
    view.innerHTML = `<div class="wrap">
      <div class="mhead"><div class="k">정리 전 · ${all.length}개 남음</div><h1>하나씩 꽂아 볼까요</h1>
        <p>폴더째 들인 봇이에요. 폴더·상태·태그를 고르고 '정리 끝'을 누르면 서재로 들어가요. 여러 개를 골라 한꺼번에 정해도 돼요.</p></div>
      <div class="ibs">${all.map(b => `<div class="ibt${(picked.size > 1 ? picked.has(b.id) : b.id === (one && one.id)) ? ' on' : ''}" data-b="${b.id}">
        <button type="button" class="ibc" aria-label="${h(b.name)} 고르기">${cover(b)}</div></button>
        <label class="ibk" title="여러 개 고르기"><input type="checkbox" data-k="${b.id}"${picked.has(b.id) ? ' checked' : ''}></label><b>${h(b.name)}</b></div>`).join('')}</div>
      <section class="ibx">
        ${one ? `<div class="ibh">${cover(one)}</div><div><h2>${h(one.name)}</h2>
          <p class="meta">${one.creator ? h(one.creator) + ' · ' : ''}${[one.version ? `지금 버전 ${h(one.version)}` : '', `자료 ${one.files}`, one.chats ? `채팅 로그 ${one.chats}` : ''].filter(Boolean).join(' · ')}</p>
          <a class="btn sm ghost" href="#/b/${one.id}">봇 페이지 열기 →</a></div></div>`
        : `<div class="ibh"><div><h2>${sel.length}개 한꺼번에</h2><p class="meta">${h(sel.map(b => b.name).join(', '))}</p>
          <p class="hint">고른 폴더·태그는 더해지고, 상태는 고른 경우에만 바뀌어요.</p></div></div>`}
        <div><p class="legend">어느 폴더에 꽂을까요?<span>여러 곳에 같이 넣을 수 있어요</span></p><div class="ftiles" id="ixF"></div></div>
        <div class="field">상태<div class="seg" id="ixS">${Object.entries(STATUS).map(([k, v]) => `<button type="button" class="pill" data-s="${k}" aria-pressed="${k === status}">${h(v)}</button>`).join('')}</div></div>
        <label class="field">태그<input class="inp" id="ixT" maxlength="400" placeholder="쉼표로 여러 개 — 예: 판타지, 육성" value="${one ? h(one.tags.join(', ')) : ''}"></label>
        <div class="row ibf">${one && all.length > 1 ? `<button class="btn" id="ixLater">나중에 →</button>` : ''}
          <button class="btn pri" id="ixDone">${one ? '정리 끝' : `${sel.length}개 정리 끝`}${all.length > sel.length ? ' → 다음' : ''}</button></div>
      </section></div>`;
    folderTiles($('#ixF'), chosen);
    $$('#ixS .pill').forEach(x => x.onclick = () => { status = status === x.dataset.s && !one ? '' : x.dataset.s; $$('#ixS .pill').forEach(y => y.setAttribute('aria-pressed', y.dataset.s === status)); });
    $$('.ibc').forEach(x => x.onclick = () => { picked.clear(); cur = +x.closest('.ibt').dataset.b; draw(); });
    $$('[data-k]').forEach(x => x.onchange = () => {
      const id = +x.dataset.k;
      if (x.checked) { if (!picked.size && one) picked.add(one.id); picked.add(id); } else picked.delete(id);
      if (picked.size === 1) { cur = [...picked][0]; picked.clear(); }
      draw();
    });
    const next = ids => { const i = all.findIndex(b => ids.includes(b.id)); const rest = all.filter(b => !ids.includes(b.id)); return (rest[i] || rest[i - 1] || rest[0] || {}).id; };
    if ($('#ixLater')) $('#ixLater').onclick = () => { const i = all.indexOf(one); cur = all[(i + 1) % all.length].id; draw(); };
    $('#ixDone').onclick = async () => {
      const btn = $('#ixDone'); btn.disabled = true;
      const tags = $('#ixT').value.split(',').map(t => t.trim().replace(/^#/, '')).filter(Boolean);
      try {
        for (const b of sel) {
          await api('PUT', `/api/bots/${b.id}`, one ? {folders: [...chosen], status, tags, inbox: false}
            : {folders: [...new Set([...b.folders, ...chosen])], tags: [...b.tags, ...tags], inbox: false, ...(status ? {status} : {})});
        }
        const ids = sel.map(b => b.id);
        cur = next(ids);
        ids.forEach(id => all.splice(all.findIndex(b => b.id === id), 1));
        picked.clear();
        await loadState();
        toast(sel.length > 1 ? `${sel.length}개를 서재에 꽂았어요` : `${sel[0].name}을(를) 서재에 꽂았어요`);
        if (!all.length) return viewInbox();
        draw();
      } catch (e) { fail(e); btn.disabled = false; }
    };
  };
  draw();
}

// ---- 홈 숫자: 봇 · 지금 버전 로어북 토큰 · 채팅 로그 토큰 · 지금 버전 에셋 (처음 셀 때는 몇 초 걸려서 나중에 채움) ----
const bigNum = n => n >= 1e8 ? `${+(n / 1e8).toFixed(1)}억` : n >= 1e4 ? `${+(n / 1e4).toFixed(1)}만` : n.toLocaleString('ko-KR');
function statTiles(t, nBots) {
  const tile = (label, n, sub, title = '') => `<div class="mst"${title ? ` title="${h(title)}"` : ''}><span>${label}</span><b>${n == null ? '…' : bigNum(n)}</b><small>${sub || '&nbsp;'}</small></div>`;
  const tk = '토큰은 어림값이에요 — 한글 1자 ≈ 1토큰, 영어 4자 ≈ 1토큰. 쓰는 모델마다 달라요.';
  if (!t) return [tile('봇', nBots, ''), tile('로어북 토큰', null, '세는 중…'), tile('채팅 로그 토큰', null, '세는 중…'), tile('에셋', null, '세는 중…')].join('');
  return [tile('봇', t.bots, Object.entries(STATUS).map(([k, v]) => t.status[k] ? `${h(v)} ${t.status[k]}` : '').filter(Boolean).join(' · ')),
    tile('로어북 토큰', t.lore_tokens, `지금 버전 · 항목 ${t.lore_entries.toLocaleString('ko-KR')}개 · 봇 ${t.lore_bots}개`, `${t.lore_tokens.toLocaleString('ko-KR')} 토큰 — ${tk}`),
    tile('채팅 로그 토큰', t.chat_tokens, `로그 ${t.chats}개 · 메시지 ${t.messages.toLocaleString('ko-KR')}개`, `${t.chat_tokens.toLocaleString('ko-KR')} 토큰 — ${tk}`),
    tile('에셋', t.assets, `지금 버전 · 봇 ${t.asset_bots}개`, `${t.assets.toLocaleString('ko-KR')}개 (카드·모듈 속 그림 등)`)].join('');
}

const GREET_TIME = {dawn: ['이 시간까지 깨어 있네요', '새벽엔 조용한 이야기가 좋아요', '한 장만 더 읽고 잘까요'],

  day: ['점심은 먹었어요? 잠깐 쉬어 가요', '오후의 한 권, 누구로 할까요', '잠깐 쉬는 시간이에요'],

const GREET = {
  spring: {dawn: ['새벽 벚꽃 사이로, 누구를 꺼낼까요', '잠 못 드는 봄 새벽이에요'], morning: ['봄 아침, 첫 장을 넘겨 볼까요', '꽃 피는 아침이에요. 누구부터 볼까요'],

    night: ['봄밤엔 긴 이야기가 어울려요', '꽃내음 나는 밤, 누구를 꺼낼까요']},
  summer: {dawn: ['짧은 여름밤이 끝나 가요. 한 장만 더?', '여름 새벽, 아직 깨어 있네요'], morning: ['여름 아침, 시원하게 시작해 볼까요', '매미보다 먼저 일어났네요'],
    day: ['더운 오후엔 서늘한 이야기 어때요', '에어컨 아래서 누구를 꺼낼까요'], evening: ['해가 긴 여름 저녁, 천천히 골라요', '소나기 그친 저녁이에요'],
    night: ['열대야엔 긴 이야기가 제맛이죠', '여름밤, 누구와 밤을 새울까요']},
  autumn: {dawn: ['가을 새벽 공기가 차요. 누구를 꺼낼까요', '서늘한 새벽, 한 권만 더'], morning: ['가을 아침, 책장 넘기기 좋은 날이에요', '선선한 아침이에요. 누구부터 볼까요'],
    day: ['독서하기 좋은 가을 오후예요', '하늘 높은 날, 누구를 꺼낼까요'], evening: ['해가 일찍 져요. 누구와 저녁을 보낼까요', '단풍빛 저녁이에요'],
    night: ['긴 가을밤, 누구를 꺼낼까요', '귀뚜라미 우는 밤이에요']},
  winter: {dawn: ['겨울 새벽, 이불 속에서 한 장만 더', '눈 오는 새벽일까요? 누구를 꺼낼까요'], morning: ['추운 아침이에요. 따뜻한 이야기 어때요', '겨울 아침, 핫초코와 함께 골라요'],
    day: ['짧은 겨울 낮, 누구를 꺼낼까요', '창밖이 하얀 오후예요'], evening: ['일찍 어두워졌어요. 누구를 만날까요', '겨울 저녁, 난롯가에서 한 권'],
    night: ['긴 겨울밤엔 긴 이야기를', '눈 내리는 밤, 누구를 꺼낼까요']}};
const GREET_DAY = {'1-1': '새해 첫 장, 누구와 열까요', '2-14': '발렌타인데이, 누구에게 마음이 가나요', '10-31': '할로윈 밤, 무서운 이야기 어때요',
  '12-24': '크리스마스이브엔 누구를 꺼낼까요', '12-25': '메리 크리스마스! 누구와 보낼까요', '12-31': '올해 마지막 날, 누구와 마무리할까요'};
const SEASON = {spring: '🌸 봄', summer: '🌿 여름', autumn: '🍂 가을', winter: '❄️ 겨울'};
const DAYPART = {dawn: '새벽', morning: '아침', day: '낮', evening: '저녁', night: '밤'};
function greeting(d = new Date()) {
  const mo = d.getMonth() + 1, hr = d.getHours();
  const season = mo >= 3 && mo <= 5 ? 'spring' : mo >= 6 && mo <= 8 ? 'summer' : mo >= 9 && mo <= 11 ? 'autumn' : 'winter';
  const part = hr < 5 ? 'dawn' : hr < 11 ? 'morning' : hr < 17 ? 'day' : hr < 21 ? 'evening' : 'night';
  const k = `${SEASON[season]} ${DAYPART[part]}`, special = GREET_DAY[`${mo}-${d.getDate()}`];
  if (special) return {k, title: special};
  const seed = [...`${d.getFullYear()}-${mo}-${d.getDate()}-${part}`].reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7);
  const l = [GREET_BASIC, GREET_TIME[part], GREET[season][part]][seed % 3];  // 세 갈래가 고르게
  return {k, title: l[(seed >>> 2) % l.length]};
}

// 카드·모듈 속 로어북 · 에셋 보기 (서버가 파일에서 필요한 조각만 꺼내 줌)
// 탭(지금 버전의 카드+모듈 전부)과 파일 하나 들여다보기 창이 같은 그리기를 씀
const PEEK_KINDS = ['card', 'module'];
const peekFiles = v => B.files.filter(f => f.version_id === (v ? v.id : null) && PEEK_KINDS.includes(f.kind)).sort((a, b) => (a.kind === 'card' ? 0 : 1) - (b.kind === 'card' ? 0 : 1));
const fbase = f => f.base || `/api/files/${f.id}`;  // 페르소나 자료는 base로 따로 (/api/pfiles/<id>)
async function loreView(el, files) {
  el.innerHTML = '<p class="hint">파일에서 로어북을 읽는 중…</p>';
  const res = await Promise.all(files.map(f => api('GET', `${fbase(f)}/lore`).then(d => ({f, d}), e => ({f, err: e.message}))));
  const groups = [];
  for (const r of res) {
    if (r.err) { groups.push({title: r.f.name, err: r.err, entries: []}); continue; }
    for (const s of r.d.sources) groups.push({title: s.label, file: files.length > 1 ? r.f.name : '', entries: s.entries, pinned: !!s.pinned});
  }
  groups.sort((a, b) => b.pinned - a.pinned);  // 카드 프롬프트(메인 프롬프트·글로벌 노트)는 맨 위
  const total = groups.reduce((n, g) => n + (g.pinned ? 0 : g.entries.filter(e => e.mode !== 'folder').length), 0);
  if (!total && !groups.some(g => g.pinned)) {
    el.innerHTML = `<p class="hint">로어북 항목이 없어요.</p>${groups.filter(g => g.err).map(g => `<p class="err-t">${h(g.title)}: ${h(g.err)}</p>`).join('')}`;
    return;
  }
  el.innerHTML = `<div class="pk-top"><input class="inp" id="pkQ" placeholder="이름·키워드·내용에서 찾기" style="flex:1;min-height:40px"><span class="meta" id="pkN"></span></div><div id="pkL"></div>`;
  for (const g of groups) {  // 리스 폴더: mode 'folder' 항목 아래에 folder = 그 id인 항목들
    g.folders = new Map(g.entries.filter(e => e.mode === 'folder' && e.fid).map(e => [e.fid, e]));
    g.items = g.entries.filter(e => e.mode !== 'folder');
  }
  const entry = (g, e, showFolder) => `<details class="le${e.enabled ? '' : ' off'}"><summary>
      <b>${h(e.name || e.keys[0] || '이름 없음')}</b>${e.mode === 'prompt' ? `<span class="meta">${[...e.content].length.toLocaleString()}자</span>` : ''}${e.constant ? '<span class="badge">항상 켜짐</span>' : ''}${e.enabled ? '' : '<span class="badge off">꺼짐</span>'}
      ${showFolder && g.folders.has(e.folder) ? `<span class="meta">${ic('box', 12)} ${h(g.folders.get(e.folder).name)}</span>` : ''}
      ${e.keys.length ? `<span class="lk-keys">${e.keys.slice(0, 8).map(k => `<i>${h(k)}</i>`).join('')}${e.keys.length > 8 ? `<i>+${e.keys.length - 8}</i>` : ''}</span>` : ''}</summary>
      ${e.secondary.length ? `<p class="meta">함께 걸리는 키: ${e.secondary.map(h).join(', ')}</p>` : ''}<pre>${h(e.content) || '<span class="meta">(내용 없음)</span>'}</pre></details>`;
  const head = (g, n) => groups.length > 1 || g.pinned ? `<h4 class="lsrc">${h(g.title)}${g.file ? `<span class="meta">${h(g.file)}</span>` : ''}<span class="meta">${n}개</span></h4>` : '';
  const draw = () => {
    const q = $('#pkQ', el).value.trim().toLowerCase();
    if (q) {  // 찾을 땐 폴더 없이 걸린 것만 (어느 폴더인지 같이 표시)
      let n = 0;
      $('#pkL', el).innerHTML = groups.map(g => {
        const list = g.items.filter(e => [e.name, e.content, ...e.keys, ...e.secondary].join('\n').toLowerCase().includes(q));
        n += list.length;
        return list.length ? head(g, list.length) + `<div class="lore">${list.slice(0, 300).map(e => entry(g, e, true)).join('')}</div>` : '';
      }).join('') || '<p class="hint">찾는 내용이 없어요</p>';
      $('#pkN', el).textContent = `${n} / ${total}개`;
      return;
    }
    const nf = groups.reduce((n, g) => n + g.folders.size, 0);
    $('#pkN', el).textContent = `항목 ${total}개${nf ? ` · 폴더 ${nf}개` : ''}`;
    $('#pkL', el).innerHTML = groups.map(g => {
      if (g.err) return `<h4 class="lsrc">${h(g.title)}</h4><p class="err-t">${h(g.err)}</p>`;
      if (!g.items.length) return '';
      const loose = g.items.filter(e => !g.folders.has(e.folder));
      return head(g, g.items.length) + `<div class="lore">${[...g.folders.values()].map(fd => {
        const kids = g.items.filter(e => e.folder === fd.fid);
        return `<details class="lfold"><summary>${ic('box', 15)}<b>${h(fd.name || '폴더')}</b><span class="meta">${kids.length}개</span></summary>
          <div class="lore">${kids.map(e => entry(g, e)).join('') || '<p class="hint">비어 있어요</p>'}</div></details>`;
      }).join('')}${loose.map(e => entry(g, e)).join('')}</div>`;
    }).join('');
  };
  $('#pkQ', el).oninput = draw;
  draw();
}
async function assetView(el, files) {
  el.innerHTML = '<p class="hint">파일에서 에셋 목록을 읽는 중…</p>';
  const res = await Promise.all(files.map(f => api('GET', `${fbase(f)}/assets`).then(d => ({f, d}), e => ({f, err: e.message}))));
  const groups = [], all = [];
  for (const r of res) {
    if (r.err) continue;
    for (const s of r.d.sources) {
      const g = {n: groups.length, title: s.label + (files.length > 1 && s.kind === 'c' ? '' : ''), count: 0};
      for (const a of s.assets) if (a.here || a.url) {
        all.push({...a, g: g.n, src: a.here ? `${fbase(r.f)}/${s.kind === 'm' ? 'masset' : 'asset'}/${a.i}` : a.url}); g.count++;
      }
      if (g.count) groups.push(g);
    }
  }
  if (!all.length) { el.innerHTML = `<p class="hint">파일 안에 든 에셋이 없어요.</p>${res.filter(r => r.err).map(r => `<p class="err-t">${h(r.f.name)}: ${h(r.err)}</p>`).join('')}`; return; }
  el.innerHTML = `${groups.length > 1 ? `<div class="seg" id="pkG0" style="margin-bottom:10px"><button class="pill" data-g="" aria-pressed="true">전체<span class="c">${all.length}</span></button>

    <div class="pk-top"><input class="inp" id="pkQ" placeholder="에셋 이름으로 찾기" style="flex:1;min-height:40px"><span class="meta" id="pkN"></span></div>
    <div class="agrid" id="pkG"></div><button class="btn sm" id="pkMore" hidden style="margin:12px auto 0;display:flex">더 보기</button>`;
  const VID = /^(mp4|webm)$/, AUD = /^(mp3|ogg|wav)$/;
  let list = all, shown = 0, grp = '';
  const tile = (a, k) => `<figure class="at" data-k="${k}" title="${h(a.name)}">${VID.test(a.ext) ? `<video src="${h(a.src)}" muted loop preload="metadata"></video>`
      : AUD.test(a.ext) ? `<span class="aud">${ic('play', 22)}</span>` : `<img src="${h(a.src)}" alt="" loading="lazy">`}
    <figcaption>${h(a.name || '(이름 없음)')}${a.type && !/^(x-risu-asset|asset)$/.test(a.type) ? ` <span class="meta">${h(a.type)}</span>` : ''}</figcaption></figure>`;
  const more = () => {
    const next = list.slice(shown, shown + 120);
    $('#pkG', el).insertAdjacentHTML('beforeend', next.map((a, j) => tile(a, shown + j)).join(''));
    shown += next.length;
    $('#pkMore', el).hidden = shown >= list.length;
    $('#pkMore', el).textContent = `더 보기 (${list.length - shown}개 남음)`;
  };
  const draw = () => {
    const q = $('#pkQ', el).value.trim().toLowerCase();
    list = all.filter(a => (grp === '' || a.g === +grp) && (!q || a.name.toLowerCase().includes(q)));
    $('#pkN', el).textContent = list.length === all.length ? `${all.length}개` : `${list.length} / ${all.length}개`;
    $('#pkG', el).innerHTML = ''; shown = 0; more();
  };
  $$('#pkG0 [data-g]', el).forEach(b => b.onclick = () => { grp = b.dataset.g; $$('#pkG0 [data-g]', el).forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); });
  $('#pkMore', el).onclick = more;
  $('#pkQ', el).oninput = draw;
  $('#pkG', el).onclick = e => {
    const t = e.target.closest('.at'); if (!t) return;
    const a = list[+t.dataset.k];
    if (VID.test(a.ext) || AUD.test(a.ext)) window.open(a.src, '_blank', 'noopener'); else lightbox(a.src);
  };
  draw();
}

  const author = who ? (who.getAttribute('data-filter') || who.textContent).replace(/\s+/g, ' ').trim() : '';
  const link = [...doc.querySelectorAll('a[href]')].map(a => a.getAttribute('href')).find(u => /^https:\/\/arca\.live\/b\/[\w-]+\/\d+/.test(u || ''));

}

// 채팅 로그 탭
// ---- 채팅 시리즈: 같은 이야기를 여러 기록으로 나눠 내보낸 것 (예: 에린부족 시즌2-01, -02 …) ----
// 제목 뒤쪽 번호로 화를 알아봄: "에린부족 시즌2-04(1년 여름)" → 시리즈 "에린부족 시즌2", 4화, 부제 "1년 여름"
function epOf(title) {
  const t = String(title || '').trim();
  const sub = (t.match(/[([【]([^)\]】]*)[)\]】]\s*$/) || [])[1] || '';
  const base = t.replace(/\s*[([【][^)\]】]*[)\]】]\s*$/, '');
  const m = base.match(/^(.*?)[\s\-_#:.·~]*(?:ep\.?|part\s*)?(\d{1,3})\s*(?:화|편|회|부|장)?$/i);
  return m && /\p{L}/u.test(m[1]) ? {key: m[1].trim(), n: +m[2], sub} : {key: '', n: null, sub};  // 앞부분에 글자가 있어야 ("2026" 같은 건 아님)
}
const epNum = c => c.ep != null ? c.ep : epOf(c.title).n;
const seriesSort = list => [...list].sort((a, b) => {
  const x = epNum(a), y = epNum(b);
  return x != null && y != null && x !== y ? x - y : (a.first_at || 0) - (b.first_at || 0) || a.id - b.id;

function seriesGroups(chats) {
  const map = new Map();
  for (const c of chats) { const k = c.series || ''; if (!map.has(k)) map.set(k, []); map.get(k).push(c); }
  return [...map.entries()].map(([name, list]) => ({name, chats: name ? seriesSort(list) : list}))
    .sort((a, b) => (a.name ? 0 : 1) - (b.name ? 0 : 1) || Math.max(...b.chats.map(c => c.last_at || 0)) - Math.max(...a.chats.map(c => c.last_at || 0)));

// 아직 안 묶인 기록 중 제목이 같은 틀인 것 2개 이상 → 묶자고 권함
function seriesHints(chats) {
  // 한 글자 오타(에린부족/에리부족)는 같은 틀로 봄, 이름은 가장 많이 쓴 쪽
  const near = (a, b) => {
    if (a === b) return true;
    if (Math.abs(a.length - b.length) > 1 || Math.min(a.length, b.length) < 4) return false;
    let i = 0; while (i < a.length && a[i] === b[i]) i++;
    return a.slice(i + 1) === b.slice(i + 1) || a.slice(i) === b.slice(i + 1) || a.slice(i + 1) === b.slice(i);
  };
  const groups = [];
  for (const c of chats) if (!c.series) {
    const e = epOf(c.title); if (!e.key) continue;
    const g = groups.find(x => x.keys.some(k => near(k, e.key)));
    if (g) { g.keys.push(e.key); g.list.push(c); } else groups.push({keys: [e.key], list: [c]});
  }
  return groups.filter(g => g.list.length > 1).map(g => {
    const cnt = {}; g.keys.forEach(k => cnt[k] = (cnt[k] || 0) + 1);
    return {key: Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0], list: g.list};
  });
}
