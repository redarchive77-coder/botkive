async function uploadFiles(files, params, after, card) {
  const t = document.createElement('div');
  t.className = 'toast'; document.body.append(t);
  try {
    for (const [i, f] of files.entries()) {
      const kind = card ? 'card' : (params.kind || kindOf(f.name));
      t.textContent = `올리는 중 ${i + 1}/${files.length} · ${f.name}`;
      await upload(f, {...params, kind, name: f.name}, p => t.textContent = `올리는 중 ${i + 1}/${files.length} · ${f.name} ${Math.round(p * 100)}%`);
    }
    t.remove(); toast(`${files.length}개 올렸어요`);
  } catch (e) { t.remove(); fail(e); }
  await loadState(); after();
}
async function uploadCard(file) {
  if (!file) [file] = await pick('.charx,.png,.jpg,.jpeg,.json,.zip');
  if (!file) return;
  let c = null;
  try { c = await readCard(file); } catch (e) { /* 못 읽는 카드도 파일은 보관 */ }
  if (c && !B.cover && c.cover) await saveBot({cover: c.cover}).catch(() => {});
  let vid = null;
  try {
    const d = await upload(file, {bot: B.id, kind: 'card', name: file.name});
    vid = d.version_id;
    if (vid && c && c.info && c.info.lore != null) await api('PUT', `/api/versions/${vid}`, {info: c.info});
    toast('카드를 올렸어요');
  } catch (e) { fail(e); }
  await loadState(); viewBot(B.id, curTab());
}
// 파일 여러 개를 보고 종류를 정함 (.png·.jpeg·.json은 카드 정보가 들어 있으면 카드)
async function sortFiles(files) {
  const out = [];
  for (const f of files) {
    let kind = kindOf(f.name), card = null;
    if (kind === 'card' || /\.(png|jpe?g|json)$/i.test(f.name)) {
      try { const c = await readCard(f); if (c.module) kind = 'module'; else if (c.info && c.info.lore != null) { kind = 'card'; card = c; } } catch (e) {}
    }
    out.push({file: f, kind, card});
  }
  return out;
}
async function uploadSorted(list, params, onEach) {
  const t = document.createElement('div');
  t.className = 'toast'; document.body.append(t);
  try {
    for (const [i, x] of list.entries()) {
      const label = `올리는 중 ${i + 1}/${list.length} · ${x.file.name}`;
      t.textContent = label;
      await upload(x.file, {...params, kind: x.kind, name: x.file.name}, p => t.textContent = `${label} ${Math.round(p * 100)}%`);
      if (onEach) await onEach(x);
    }
    t.remove(); toast(`${list.length}개 올렸어요`);
  } catch (e) { t.remove(); fail(e); }
}

function parseChats(text, fname, botName) {
  const base = fname.replace(/\.[^.]+$/, '');
  const list = [];
  const ms = t => !t ? 0 : t < 1e12 ? t * 1000 : t;
  const take = (c, i) => {
    const raw = c.message || c.messages || [];
    const msgs = raw.map(m => ({r: m.role === 'user' || m.is_user ? 'user' : 'char', n: m.name || '', t: String(m.data ?? m.content ?? m.mes ?? ''), at: ms(+m.time || Date.parse(m.send_date || '') || 0)})).filter(m => m.t.trim());
    if (msgs.length) list.push({title: c.name || (base + (i ? ` (${i + 1})` : '')), msgs, memo: typeof c.note === 'string' ? c.note : ''});
  };
  let obj = null;
  try { obj = JSON.parse(text); } catch (e) {
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    try { const arr = lines.map(l => JSON.parse(l)); take({name: base, message: arr.filter(x => 'mes' in x)}, 0); return list; } catch (e2) { throw new Error('JSON 파일이 아니에요'); }
  }
  if (obj && obj.type === 'risuChat' && obj.data) take(obj.data, 0);
  else if (obj && Array.isArray(obj.data) && obj.data.some(c => c && Array.isArray(c.message))) obj.data.forEach(take);
  else if (obj && obj.data && Array.isArray(obj.data.message)) take(obj.data, 0);
  else if (obj && Array.isArray(obj.message)) take(obj, 0);
  else if (obj && Array.isArray(obj.chats)) obj.chats.forEach(take);
  else if (Array.isArray(obj)) {
    if (obj.some(c => c && Array.isArray(c.message))) obj.forEach(take);
    else take({name: base, message: obj}, 0);
  }
  if (!list.length) throw new Error('채팅 메시지를 찾지 못했어요');
  return list;
}

// ---- 채팅 글 그리기 (허용한 태그만, 마크다운 조금) ----
const ASSET_RE = /\{\{(?:inlay|inlayed|inlayeddata|img|image|asset|emotion|bg|bgm|video|audio|source|path)::[^}]*\}\}|<img=[^>]*>/gi;
const KEEP = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'S', 'DEL', 'BR', 'P', 'SMALL', 'SUB', 'SUP', 'BLOCKQUOTE', 'UL', 'OL', 'LI', 'HR', 'CODE', 'PRE', 'DETAILS', 'SUMMARY', 'TABLE', 'THEAD', 'TBODY', 'TR', 'TD', 'TH', 'H1', 'H2', 'H3', 'H4']);
const GONE = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'TEMPLATE', 'NOSCRIPT', 'SVG', 'MATH', 'TITLE', 'HEAD', 'LINK', 'META', 'BUTTON', 'INPUT', 'TEXTAREA', 'SELECT', 'FORM']);
const MEDIA_T = new Set(['IMG', 'VIDEO', 'AUDIO', 'PICTURE', 'CANVAS']);
const BLOCK = new Set(['DIV', 'SECTION', 'ARTICLE', 'HEADER', 'FOOTER', 'ASIDE', 'MAIN', 'NAV', 'FIGURE']);
const MD = /()|\*\*([^*\n]+?)\*\*|\*([^*\n]+?)\*|("[^"\n]{1,600}"|“[^”\n]{1,600}”|「[^」\n]{1,600}」)|(\n)/g;
function chip() { const s = document.createElement('span'); s.className = 'asset'; s.textContent = '🖼 그림'; return s; }
function inline(text, dst) {
  if (text.includes('\ue001')) {  // 에셋 이름 자리 → 그 봇의 카드·모듈 그림 (못 찾으면 '그림' 칩)
    text.split(/\ue001([^\ue002]*)\ue002/).forEach((t, i) => {
      if (i % 2 === 0) { if (t) inline(t, dst); return; }
      const src = findAsset(t);
      if (!src) { dst.append(chip()); return; }
      const im = document.createElement('img');
      im.className = 'emo'; im.loading = 'lazy'; im.alt = t; im.title = t; im.src = src;
      dst.append(im);
    });
    return;
  }
  let last = 0, m;
  MD.lastIndex = 0;
  while ((m = MD.exec(text))) {
    if (m.index > last) dst.append(text.slice(last, m.index));
    if (m[1]) dst.append(chip());
    else if (m[2]) { const e = document.createElement('strong'); e.textContent = m[2]; dst.append(e); }
    else if (m[3]) { const e = document.createElement('em'); e.textContent = m[3]; dst.append(e); }
    else if (m[4]) { const e = document.createElement('span'); e.className = 'q'; e.textContent = m[4]; dst.append(e); }
    else if (m[5]) dst.append(document.createElement('br'));
    last = MD.lastIndex;
  }
  if (last < text.length) dst.append(text.slice(last));
}

    if (n.nodeType !== 1) continue;
    const t = n.tagName;
    if (GONE.has(t)) continue;
    if (MEDIA_T.has(t)) { dst.append(chip()); continue; }
    if (KEEP.has(t)) { const e = document.createElement(t); dst.append(e); walk(n, e); }
    else { walk(n, dst); if (BLOCK.has(t)) dst.append(document.createElement('br')); }
  }
}
const parser = new DOMParser();
const assetName = t => /^\{\{inlay/i.test(t) ? '' : (t.match(/^<img="?([^">]+)/i) || t.match(/::([^}]*)\}\}$/) || [])[1] || '';

  const doc = parser.parseFromString('<!doctype html><body>' + text.replace(ASSET_RE, t => keepAssets && assetName(t) ? '' + assetName(t) + '' : '').replace(/\r\n?/g, '\n'), 'text/html');
  const out = document.createElement('div');
  out.className = 'tx';
  walk(doc.body, out);

}

async function loadChatAssets(botId) {
  const map = new Map(), rx = [];
  map.rx = rx; map.rxMode = {};  // 표시용 정규식 전부 + 봇마다 고른 방식 (applyRx · rxDialog)
  try {
    const b = await api('GET', `/api/bots/${botId}`);
    map.rxMode = b.rx || {};
    const cur = (b.versions || []).find(v => v.current);
    const files = b.files.filter(f => ['card', 'module'].includes(f.kind)).sort((x, y) =>
      (y.version_id === (cur && cur.id)) - (x.version_id === (cur && cur.id)) || (x.kind === 'card' ? 0 : 1) - (y.kind === 'card' ? 0 : 1));
    for (const f of files.slice(0, 6)) {
      const d = await api('GET', `/api/files/${f.id}/assets`).catch(() => null);
      if (!d) continue;
      for (const r of d.regex || []) if (!rx.some(x => x.key === r.key)) rx.push({...r, src: f.name});
      for (const s of d.sources) for (const a of s.assets) {
        const k = assetKey(a.name);
        if (k && (a.here || a.url) && !map.has(k)) map.set(k, a.here ? `/api/files/${f.id}/${s.kind === 'm' ? 'masset' : 'asset'}/${a.i}` : a.url);
      }
    }
  } catch (e) {}
  return map;
}
// 카드·모듈의 표시용 정규식 중 그림 넣는 것을 리스처럼 돌림 — 결과 HTML 꾸밈은 빼고 그 안의 에셋만 <img="이름">으로
// 예: 진아 {{img="jina.normal.surprised"}} → <div style="background-image:url('{{raw::$1.webp}}')"> → <img="jina.normal.surprised.webp">
// 방식(봇마다 표시 규칙에서 고름, 안 고르면 서버가 정한 auto): img 그림만 · imgall 결과 속 그림 전부(고정 이름 장식까지) · text 결과에서 꾸밈 걷고 글+그림 · hide 지우기 · off 원문 그대로
const RX_ASSET = /\{\{(?:raw|asset|image|img|emotion|path|source|bg)::([^}]+)\}\}/gi;
const RX_MODE = {img: '그림만', imgall: '그림 전부', text: '글로 바꾸기', hide: '지우기', off: '안 씀'};
const rxRe = r => { try { return new RegExp(r.in, [...new Set((r.flag || '').replace(/[^dimsuy]/g, '') + 'g')].join('')); } catch (e) { return null; } };
const rxMode = (r, modes) => (modes && modes[r.key]) || r.auto;
const imgTok = n => `<img="${n.replace(/["<>]/g, '')}">`;
function rxOut(r, mode, a) {
  if (mode === 'hide') return '';
  const groups = a.slice(1, a.findIndex(x => typeof x === 'number'));
  const sub = t => t.replace(/\$(\d{1,2}|&)/g, (_, k) => k === '&' ? a[0] : groups[+k - 1] ?? '');
  // 잡은 값($1…)이 들어간 그림만 — 고정 이름 그림(감정 배지·테두리 장식 등)은 리스에선 CSS로 골라 겹쳐 보이는 꾸밈이라 뺌
  const refs = [...r.out.matchAll(RX_ASSET)].map(x => x[1]);
  const pick = refs.filter(n => /\$(\d|&)/.test(n));
  const keep = (pick.length ? pick : refs.slice(0, 1)).map(sub);
  if (mode === 'img') return keep.map(imgTok).join('') || a[0];
  if (mode === 'imgall') return refs.map(n => imgTok(sub(n))).join('') || a[0];
  // text: 그림 자리는 그림으로, <style>·{{#if}} 같은 리스 문법은 걷고, 남은 HTML은 msgNode가 글만 남김
  let t = sub(r.out).replace(/<(style|script)[\s\S]*?<\/\1>/gi, '');
  // 속성 안 그림(style="background-image:url('{{raw::…}}')", <img src=…>)은 태그 밖으로 꺼냄 — 안 그러면 속성째 사라짐
  t = t.replace(/<([a-zA-Z][\w-]*)([^>]*)>/g, (_, tg, at) => {
    const toks = [...at.matchAll(RX_ASSET)].map(x => x[1]).filter(n => keep.includes(n)).map(imgTok).join('');
    return /^img$/i.test(tg) ? toks : `<${tg}>${toks}`;
  });
  t = t.replace(RX_ASSET, (x, n) => keep.includes(n) ? imgTok(n) : '');
  for (let k = 0; k < 10; k++) { const u = t.replace(/\{\{[^{}]*\}\}/g, ''); if (u === t) break; t = u; }
  return t;
}
function applyRx(text) {
  const rx = chatAssets && chatAssets.map.rx;
  if (!rx || !rx.length) return text;
  for (const r of rx) {
    const mode = rxMode(r, chatAssets.map.rxMode), re = mode !== 'off' && rxRe(r);
    if (re) text = text.replace(re, (...a) => rxOut(r, mode, a));
  }
  return text;
}
// 로그 표시 규칙: 봇 카드·모듈의 표시용 정규식마다 방식 고르기 (texts가 있으면 이 로그에서 몇 번 걸리는지도)
async function rxDialog(botId, texts, after) {
  const m = modal(`<header><h2>로그 표시 규칙</h2><span>카드·모듈의 표시용 정규식</span>${xBtn}</header><div class="bd"><p class="hint">읽는 중…</p></div>`);
  const map = await loadChatAssets(botId), rx = map.rx, bd = $('.bd', m);
  if (!rx.length) { bd.innerHTML = '<p class="hint">이 봇의 카드·모듈에는 표시용 정규식이 없어요.</p>'; return; }
  const hits = r => { if (!texts) return null; const re = rxRe(r); if (!re) return 0; let n = 0; for (const t of texts) n += (t.match(re) || []).length; return n; };
  const rows = rx.map(r => ({r, n: hits(r)})).sort((x, y) => (y.n || 0) - (x.n || 0));
  const what = r => {
    const imgs = [...r.out.matchAll(RX_ASSET)].length;
    const txt = /\S/.test(r.out.replace(/<(style|script)[\s\S]*?<\/\1>/gi, '').replace(RX_ASSET, '').replace(/\{\{[^{}]*\}\}/g, '').replace(/<[^>]*>/g, ''));
    return [imgs ? `그림 ${imgs}장` : '', txt ? '글 있음' : ''].filter(Boolean).join(' · ') || '빈 결과';
  };
  bd.innerHTML = `<p class="hint" style="margin:0 0 12px">자동은 그림만 넣는 규칙은 '그림만', 상태창처럼 글이 섞인 건 '안 씀'이에요. 이상하게 보이는 것만 바꾸면 돼요.</p>
    <div class="rxl">${rows.map(({r, n}) => `<div class="rxr${n === 0 ? ' unhit' : ''}"><div style="min-width:0"><b>${h(r.comment || '이름 없는 규칙')}</b>
        <span class="meta">${[r.src, what(r), n != null ? `이 로그에서 ${n}번` : ''].filter(Boolean).map(h).join(' · ')}</span><code>${h(r.in)}</code></div>
      <select class="sortsel" data-key="${r.key}" aria-label="방식"><option value="auto">자동 (${RX_MODE[r.auto]})</option>${Object.entries(RX_MODE).map(([k, v]) => `<option value="${k}"${map.rxMode[r.key] === k ? ' selected' : ''}>${v}</option>`).join('')}</select></div>`).join('')}</div>`;
  $$('[data-key]', bd).forEach(sel => sel.onchange = async () => {
    try { await api('POST', `/api/bots/${botId}/rx`, {key: sel.dataset.key, mode: sel.value}); chatAssets = null; toast('바꿨어요'); if (after) after(); } catch (e) { fail(e); }
  });
}
// 1·2 = 생각 글(<Thoughts>…), 3·4 = 상태창(<태그>[키: 값 | …]</태그>)
const RICH_RE = /<(thoughts?|think|thinking)>([\s\S]*?)<\/\1>|<([A-Za-z][\w-]{0,30})>\s*\[([^\]]*:[^\]]*)\]\s*<\/\3>/gi;
const blank = v => !String(v || '').replace(/[\sㅤ​]/g, '');
function statusNode(tag, body) {
  const kv = {};
  for (const part of body.split('|')) { const i = part.indexOf(':'); if (i > 0) kv[part.slice(0, i).trim()] = part.slice(i + 1).trim(); }
  const el = document.createElement('details');
  el.className = 'stc';
  const sum = document.createElement('summary'), box = document.createElement('div');
  box.className = 'st-b';
  const add = (cls, txt) => { const s = document.createElement('span'); s.className = cls; s.textContent = txt; box.append(s); return s; };
  const n = Object.keys(kv).filter(k => /^S\d+$/.test(k)).length;
  if (n && Object.keys(kv).some(k => /^T\d+$/.test(k))) {  // 인벤토리: S=그림, N=개수, T=이름
    let cnt = 0;
    for (let i = 1; i <= n; i++) if (!blank(kv['T' + i])) { add('st-i', `${blank(kv['S' + i]) ? '' : kv['S' + i] + ' '}${kv['T' + i]}${blank(kv['N' + i]) ? '' : ' ×' + kv['N' + i]}`); cnt++; }
    sum.textContent = `🎒 ${kv.Sub || tag} · ${cnt}가지`;
    if (!cnt) add('meta', '비어 있어요');
  } else if (kv.Title || Object.keys(kv).some(k => /^Item\d+$/.test(k))) {  // 보고서: 제목·장소·항목·한마디
    sum.textContent = `${kv.Icon || '📋'} ${kv.Title || tag}`;
    el.open = true;
    for (const k of ['Season', 'Location']) if (!blank(kv[k])) add('st-tag', kv[k]);
    for (let i = 1; i < 40; i++) if (!blank(kv['Item' + i])) add('st-row', `${kv[`Item${i}Icon`] || '·'} ${kv['Item' + i]}`);
    if (!blank(kv.Comment)) add('st-say', `${kv.Speaker ? kv.Speaker + ': ' : ''}"${kv.Comment}"`);
  } else {
    sum.textContent = `📋 ${tag}`;
    for (const [k, v] of Object.entries(kv)) if (!blank(v)) add('st-row', `${k}: ${v}`);
  }
  el.prepend(sum); el.append(box);
  return el;
}
function richMsg(text) {
  text = applyRx(text);
  const out = document.createElement('div');
  out.className = 'tx';
  const parts = [];
  let last = 0, m;
  const re = new RegExp(RICH_RE.source, 'gi');
  while ((m = re.exec(text))) {
    if (m.index > last) parts.push({t: text.slice(last, m.index)});
    parts.push(m[1] ? {th: m[2]} : {st: m[3], body: m[4]});
    last = re.lastIndex;
  }
  if (last < text.length) parts.push({t: text.slice(last)});
  for (const p of parts) {
    if (p.th != null) {
      if (blank(p.th)) continue;
      const d = document.createElement('details'); d.className = 'thought';
      d.innerHTML = `<summary>💭 생각 <span>${[...p.th.trim()].length.toLocaleString()}자</span></summary>`;
      const b = msgNode(p.th.trim()); b.className = 'th-b'; d.append(b); out.append(d);
    } else if (p.st) out.append(statusNode(p.st, p.body));
    else {
      // 줄 단위 마크다운 조금: --- 가로줄, ## 장면 제목
      let t = p.t.replace(/\r\n?/g, '\n').replace(/^[ \t]*(?:-{3,}|\*{3,}|_{3,})[ \t]*$/gm, '<hr>').replace(/^[ \t]*#{1,4}[ \t]+(.+)$/gm, '<h4>$1</h4>');
      t = t.replace(/^(\s*<hr>\s*)+/, '').replace(/(\s*<hr>\s*)+$/, '');  // 앞뒤 가로줄은 군더더기
      // 빈 줄로 나뉜 덩어리는 문단으로 (빈 줄을 줄바꿈 두 번으로 그리면 사이가 너무 벌어짐)
      t = t.trim().split(/\n[ \t　]*\n\s*/).map(x => /^<(hr|h4)>/.test(x) ? x : `<p>${x}</p>`).join('');
      if (blank(t)) continue;
      const node = msgNode(t, true);
      while (node.firstChild) out.append(node.firstChild);
    }
  }
  return out;
}

// 리스에서 내보낸 페르소나 PNG: tEXt 'persona' = base64(JSON {name, personaPrompt, note})
async function personaPngText(file) {

const SROLE = {official: '공식', mine: '어울림'};
const SETL = {model: '모델', sampler: '샘플러', steps: '스텝', scale: '가이던스', cfg_rescale: '리스케일', noise_schedule: '노이즈 스케줄', size: '크기', extra: '그 밖의 설정'};
document.addEventListener('click', e => { const a = e.target.closest('[data-sfgo]'); if (a) ss.set('bs-sfolder', a.dataset.sfgo); });
async function copyText(t, what = '복사했어요') {
  try { await navigator.clipboard.writeText(t); }
  catch (e) {  // http(같은 와이파이 주소 등)에서는 clipboard API가 막혀 있어서 옛 방식으로
    const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;opacity:0'; document.body.append(ta); ta.select();
    try { document.execCommand('copy'); } catch (er) { ta.remove(); return toast('복사하지 못했어요', true); }
    ta.remove();
  }
  toast(what);
}
// 그림 속 생성 정보: NAI(tEXt Comment JSON) · 스테이블 디퓨전 웹UI(parameters). 없으면 null
async function genMeta(file) {
  if (!/\.png$/i.test(file.name) && file.type !== 'image/png') return null;
  const buf = new Uint8Array(await file.arrayBuffer());
  if (buf[0] !== 0x89 || buf[1] !== 0x50) return null;
  const dv = new DataView(buf.buffer), dec = new TextDecoder(), t = {};
  for (let pos = 8; pos + 8 <= buf.length;) {
    const len = dv.getUint32(pos), type = String.fromCharCode(...buf.subarray(pos + 4, pos + 8));
    if (type === 'tEXt' || type === 'iTXt') {
      const d = buf.subarray(pos + 8, pos + 8 + len), z = d.indexOf(0), k = dec.decode(d.subarray(0, z));
      if (type === 'tEXt') t[k] = dec.decode(d.subarray(z + 1));
      else if (!d[z + 1]) { let q = d.indexOf(0, z + 3) + 1; q = d.indexOf(0, q) + 1; t[k] = dec.decode(d.subarray(q)); }  // 압축 안 한 iTXt만
    }
    if (type === 'IEND') break;
    pos += 12 + len;
  }
  if (t.Comment) {
    let c; try { c = JSON.parse(t.Comment); } catch (e) { return null; }
    const v4 = c.v4_prompt && c.v4_prompt.caption, n4 = c.v4_negative_prompt && c.v4_negative_prompt.caption;
    const str = v => v == null || v === '' ? '' : String(v);

function variantDialog(x, v, add) {
  return new Promise(res => {
    const base = !add && v.id === 0;
    const m = modal(`<header><h2>${add ? '변형 더하기' : '변형 고치기'}</h2><span>${h(x.name)}</span>${xBtn}</header>

      <footer><span class="note"></span><button class="btn" data-close>취소</button><button class="btn pri" data-ok>${add ? '만들기' : '저장'}</button></footer>`);
    m.onclose = () => res(null);
    charsUI(m, v.chars);
    $('[data-ok]', m).onclick = async () => {
      const f = readVariantForm(m), btn = $('[data-ok]', m); btn.disabled = true;
      try {
        let id = v.id;
        if (add) { const d = await api('POST', `/api/styles/${x.id}/variants`, f); SY = d.style; id = d.id; }
        else if (base) { const {label, ...rest} = f; SY = await api('PUT', `/api/styles/${x.id}`, {...rest, vlabel: label}); }
        else SY = await api('PUT', `/api/style_variants/${v.id}`, f);
        m.onclose = null; m.close(); res(id);
      } catch (e) { fail(e); btn.disabled = false; }
    };
  });
}

  el.className = 'sview'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  document.body.append(el);
  const key = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1); };
  const close = () => { el.remove(); document.removeEventListener('keydown', key); };
  const go = d => { const n = L().length; if (n > 1) { i = (i + d + n) % n; draw(); } };
  document.addEventListener('keydown', key);
  const draw = () => {
    const imgs = L(), g = imgs[i], mt = g.meta || {}, texts = [];
    const set = Object.entries(mt.settings || {}).filter(([, v]) => v), chars = (mt.chars || []).map(charOf).filter(c => c.prompt || c.negative);
    const sec = (title, text) => { texts.push(text); return `<div><div class="svh">${title}<button class="ib" data-copy="${texts.length - 1}" aria-label="${title} 복사" title="복사">${ic('copy', 15)}</button></div><pre class="sprm">${h(text)}</pre></div>`; };
    const body = [mt.prompt ? sec('프롬프트', mt.prompt) : '',
      ...chars.map((c, n) => (c.prompt ? sec(`캐릭터 ${n + 1}`, c.prompt) : '') + (c.negative ? sec(`캐릭터 ${n + 1} 네거티브`, c.negative) : '')),
      mt.negative ? sec('네거티브', mt.negative) : '',
      set.length ? `<div class="kv sset" style="margin:0">${set.map(([k, v]) => `<div><b>${h(v)}</b><span>${h(SETL[k] || k)}</span></div>`).join('')}</div>` : ''].join('');
    el.innerHTML = `<div class="svimg"><img src="/m/${h(g.image)}" alt="">
        ${imgs.length > 1 ? `<button class="svnav prev" data-go="-1" aria-label="앞 그림">${ic('back', 22)}</button><button class="svnav next" data-go="1" aria-label="다음 그림">${ic('back', 22)}</button>` : ''}</div>
      <aside class="svside">
        <div class="svtop"><b>견본 그림 ${i + 1} / ${imgs.length}</b>${mt.gen ? `<span class="srole">${h(mt.gen)}</span>` : ''}<button class="ib" data-x aria-label="닫기">${ic('x', 20)}</button></div>
        ${body || '<p class="hint" style="margin:0">이 그림에는 생성 정보가 없어요. NAI·웹UI에서 바로 저장한 PNG라야 읽을 수 있어요.</p>'}
        <div class="row" style="margin-top:auto;padding-top:6px">
          <a class="btn sm ghost" href="/m/${h(g.image)}" download>${ic('dl', 15)}원본 받기</a>
          ${i ? `<button class="btn sm ghost" data-front>${ic('star', 15)}대표 그림으로</button>` : '<span class="meta">대표 그림이에요</span>'}
        </div>
      </aside>`;
    $('[data-x]', el).onclick = close;
    $('.svimg', el).onclick = e => { if (e.target === e.currentTarget) close(); };  // 그림 밖 빈 곳을 누르면 닫기
    $$('[data-go]', el).forEach(b => b.onclick = () => go(+b.dataset.go));
    $$('[data-copy]', el).forEach(b => b.onclick = () => copyText(texts[+b.dataset.copy]));
    const f = $('[data-front]', el);
    if (f) f.onclick = async () => {
      try { SY = await api('PUT', `/api/style_images/${g.id}`, {front: true}); i = 0; drawStyle(); draw(); toast('대표 그림으로 바꿨어요'); } catch (e) { fail(e); }
    };
  };
  draw();
}

// ---- 파일 모아 보기 (봇에 딸린 파일 · 예전 칸 파일) ----
async function viewShelf(sid) {
  if (!sid) return viewItems();
  const all = await api('GET', '/api/files');
  const shelves = S.state.shelves;
  const cur = sid === 'bots' ? 'bots' : sid === 'loose' ? null : +sid || null;
  const loose = all.filter(f => !f.bot_id);
  const list = cur === 'bots' ? all.filter(f => f.bot_id) : cur ? loose.filter(f => f.shelf_id === cur) : loose;
  const sh = typeof cur === 'number' ? shelves.find(s => s.id === cur) : null;
  $('#view').innerHTML = `<div class="wrap">
    <a class="backbtn" href="#/shelf">${ic('back', 16)}자료함</a>
    <div class="toolbar" style="margin-bottom:22px"><h1 class="disp" style="margin:0;font-size:34px">파일 모아 보기</h1>
      <span class="meta" style="font-size:14px">봇에 딸린 파일, 예전에 칸에 넣어 둔 파일</span></div>
    <div class="shelves">
      <a class="shelf" href="#/shelf/loose" data-rep ${cur === null ? 'aria-current="page"' : ''}><b>전체</b><span>${loose.length}개</span></a>
      ${shelves.map(s => `<a class="shelf" href="#/shelf/${s.id}" data-rep ${cur === s.id ? 'aria-current="page"' : ''}><b>${h(s.name)}</b><span>${s.count}개</span></a>`).join('')}
      <a class="shelf" href="#/shelf/bots" data-rep ${cur === 'bots' ? 'aria-current="page"' : ''}><b>봇에 딸린 자료</b><span>${all.length - loose.length}개 · 모아 보기</span></a>
      <button class="shelf add" id="sNew">${ic('plus', 16)}새 칸</button>
    </div>
    ${sh ? `<div class="toolbar"><h2>${h(sh.name)}</h2><button class="btn sm ghost" id="sRen">${ic('edit', 15)}이름 바꾸기</button><button class="btn sm ghost danger" id="sDel">${ic('trash', 15)}칸 지우기</button></div>` : ''}
    ${cur === 'bots' ? '' : `<div class="drop" id="sDrop" tabindex="0" role="button" style="margin-bottom:18px"><b>파일 끌어다 놓기 / 눌러서 고르기</b><span>${sh ? `${h(sh.name)} 칸에 넣어요` : '칸 없이 넣어요 — 나중에 옮길 수 있어요'}</span></div>`}
    <div class="box"><div class="files" id="sFiles">${list.map(f => fileRow(f, {bot: cur === 'bots'})).join('') || '<p class="hint">비어 있어요.</p>'}</div></div>
  </div>`;
  const after = () => loadState().then(() => viewShelf(sid));
  bindFiles($('#sFiles'), list, after);
  if (cur === 'bots') $$('#sFiles .fr').forEach(r => { const f = list.find(x => x.id === +r.dataset.id); if (f) { const a = document.createElement('a'); a.className = 'btn sm ghost'; a.href = `#/b/${f.bot_id}/files`; a.textContent = '봇으로'; $('.acts', r).prepend(a); } });
  $('#sNew').onclick = () => shelfDialog();
  if (sh) {
    $('#sRen').onclick = () => shelfDialog(sh);
    $('#sDel').onclick = async () => {
      if (!await confirmBox('칸 지우기', `<b>${h(sh.name)}</b> 칸을 지울까요? 안의 파일 ${sh.count}개는 '칸 없음'으로 남아요.`)) return;
      try { await api('DELETE', `/api/shelves/${sh.id}`); await loadState(); location.hash = '#/shelf/loose'; } catch (e) { fail(e); }
    };
  }
  const dz = $('#sDrop');
  if (dz) {
    const go = fs => fs.length && uploadFiles(fs, sh ? {shelf: sh.id} : {}, () => viewShelf(sid));
    dz.onclick = async () => go(await pick('', true));
    dropZone(dz, go);
  }
}
function shelfDialog(s) {
  const m = modal(`<header><h2>${s ? '칸 이름 바꾸기' : '새 칸'}</h2>${xBtn}</header>
    <div class="bd"><label class="field">이름<input class="inp" id="sn" maxlength="20" value="${h(s ? s.name : '')}" placeholder="예: 공용 모듈"></label></div>
    <footer><span class="note"></span><button class="btn" data-close>취소</button><button class="btn pri" data-ok>${s ? '저장' : '만들기'}</button></footer>`, 'narrow');
  const ok = async () => {
    try {
      const name = $('#sn', m).value.trim();
      const d = s ? await api('PUT', `/api/shelves/${s.id}`, {name}) : await api('POST', '/api/shelves', {name});
      S.state = d.state; renderSide(); m.close();
      location.hash = `#/shelf/${s ? s.id : d.id}`; if (s) route();
    } catch (e) { fail(e); }
  };
  $('[data-ok]', m).onclick = ok;
  $('#sn', m).onkeydown = e => { if (e.key === 'Enter' && !e.isComposing) ok(); };
}

// ---- 길 찾기 ----
document.addEventListener('click', e => {  // 같은 화면 안의 탭 이동은 방문 기록을 쌓지 않음
  const a = e.target.closest('a[data-rep]');
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey) return;
  e.preventDefault();
  replaceHash(a.getAttribute('href'));
});
let lastPath = '';
async function route() {
  const r = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  document.body.classList.toggle('entry', !r.length);
  renderSide();
  const path = r.slice(0, 2).join('/');
  if (path !== lastPath) window.scrollTo(0, 0);
  lastPath = path;
  try {
    if (!r.length) return await viewMain();
    if (r[0] === 'all') return await viewHome();
    if (r[0] === 'inbox') return await viewInbox();
    if (r[0] === 'f' && r[1]) return await viewHome(+r[1]);
    if (r[0] === 'b' && r[1]) return await viewBot(+r[1], r[2]);
    if (r[0] === 'c' && r[1]) return await viewChat(+r[1], +r[2] || 0);
    if (r[0] === 'chats') return await viewChats();
    if (r[0] === 'shelf') return await viewShelf(r[1]);
    if (r[0] === 'styles') return await viewStyles();
    if (r[0] === 's' && r[1]) return await viewStyle(+r[1]);
    if (r[0] === 'personas') return await viewPersonas();
    if (r[0] === 'p' && r[1]) return await viewPersona(+r[1], +r[2] || null);
    replaceHash('#/');
  } catch (e) {
    $('#view').innerHTML = `<div class="wrap"><div class="empty"><h3>못 불러왔어요</h3><p>${h(e.message)}</p><a class="btn" href="#/">서재로</a></div></div>`;
  }
}
window.addEventListener('hashchange', route);
loadState().then(route).catch(e => { if (e.login) return; $('#view').innerHTML = `<div class="wrap"><div class="empty"><h3>서버에 연결하지 못했어요</h3><p>${h(e.message)}</p></div></div>`; });
</script>
</body>
